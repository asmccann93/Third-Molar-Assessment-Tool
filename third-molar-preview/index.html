<script>
  // Service workers require http/https. Opening index.html straight from disk
  // (file://) is perfectly fine for previewing, but registration is impossible
  // there - so don't attempt it, and don't warn about it either.
  (function () {
    var served = location.protocol === "http:" || location.protocol === "https:";
    if (!("serviceWorker" in navigator) || !served) return;
    window.addEventListener("load", function () {
      Promise.reject(new Error("preview: service worker deliberately disabled")).catch(function (err) {
        // Don't assume a cause. Registration is also blocked by policy in
        // in-app browsers (iOS WKWebView) and some private modes - neither of
        // which the deployment can do anything about. So check whether the
        // supporting files are genuinely reachable before blaming them.
        var detail = (err && err.message) ? err.message : String(err);
        fetch("sw.js", { method: "HEAD" })
          .then(function (r) {
            if (!r.ok) {
              console.warn(
                "Offline support unavailable: sw.js returned " + r.status +
                ". Check that sw.js sits in the same folder as index.html."
              );
            } else {
              console.info(
                "Offline support unavailable in this browser (" + detail + "). " +
                "Supporting files are present, so this is a browser restriction - " +
                "commonly an in-app browser. The assessment tool itself is unaffected."
              );
            }
          })
          .catch(function () {
            console.info("Offline support unavailable. The assessment tool itself is unaffected.");
          });
      });
    });
  })();
</script>

<style>
  /* Offline notice. Self-contained and independent of the tool's own code, so it
     works the same on every page and survives a rebuild. */
  .osoff{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:none;
    font-family:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    font-size:13.5px;line-height:1.45;text-align:center;
    color:#FFFFFF;background:#0F2F63;padding:10px 16px;}
  @media print{.osoff{display:none !important;}}
</style>
<script>
  // The service worker keeps these tools usable without a connection, but nothing
  // on screen said so - a clinician could not tell a live page from a cached one.
  // navigator.onLine reports whether the device has a network interface, not
  // whether the server is reachable, so this is deliberately worded as "offline"
  // rather than claiming the content is stale.
  (function () {
    var el = null;
    function ensure() {
      if (el || !document.body) return el;
      el = document.createElement("div");
      el.className = "osoff";
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      el.textContent = "Offline \u2014 you are seeing the saved copy of this page. It stays fully usable.";
      document.body.appendChild(el);
      return el;
    }
    function update() {
      var n = ensure();
      if (n) n.style.display = navigator.onLine ? "none" : "block";
    }
    window.addEventListener("online", update);
    window.addEventListener("offline", update);
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", update);
    } else {
      update();
    }
  })();
</script>
<style>
  /* Interaction polish. Self-contained like the offline notice above, so it
     applies identically on all five pages without touching any tool's own code.

     This block sits after each page's own stylesheet, so where it repeats a
     property the page already sets, it wins. The transition below therefore
     names background-color and border-color as well as transform, so it adds
     the press feedback without discarding hover behaviour the pages already had. */

  a, button, [role="button"], input, select, textarea, label, summary {
    -webkit-tap-highlight-color: rgba(15, 47, 99, 0.08);
  }

  button, [role="button"], a.tool, .ostb a {
    transition: transform 80ms ease, background-color 120ms ease, border-color 120ms ease;
  }
  /* Nothing on the site acknowledged a touch until the next screen appeared.
     One pixel of travel is enough to feel like the tap registered. */
  button:not(:disabled):active,
  [role="button"]:active,
  a.tool:active,
  .ostb a:active {
    transform: translateY(1px);
  }

  /* Switcher links were about 29px tall. Touch devices get a full 44px target;
     pointer devices keep the compact bar. */
  .ostb a { display: inline-flex; align-items: center; }
  @media (pointer: coarse) {
    .ostb a { min-height: 44px; padding-left: 14px; padding-right: 14px; }
  }

  /* Figures should not change width as they change value. */
  input[type="number"], input[inputmode="decimal"], input[inputmode="numeric"],
  table, td, th, output {
    font-variant-numeric: tabular-nums;
  }

  h1, h2, h3 { text-wrap: balance; }
  p { text-wrap: pretty; }

  /* The switcher is sticky now, so an in-page jump would land under it.
     The third molar tool alone has 26 anchor links. */
  html { scroll-padding-top: 56px; }
  @media (pointer: coarse) { html { scroll-padding-top: 72px; } }

  ::selection { background: #E8EEF9; color: #0F2F63; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
