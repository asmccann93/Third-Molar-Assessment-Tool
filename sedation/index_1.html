<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="canonical" href="https://oralsurgeryassess.com/sedation/" />
<meta name="author" content="Aiden McCann" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Oral Surgery Assess" />
<meta property="og:title" content="Sedation Pre-Assessment" />
<meta property="og:description" content="Chairside pre-sedation assessment for adult dental patients, with automatic BMI, MDAS anxiety and IOSN sedation need scoring, and a printable record." />
<meta property="og:url" content="https://oralsurgeryassess.com/sedation/" />

<title>Sedation Pre-Assessment</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sedation" />

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light only;
    /* Text is blue throughout; every value below is checked for contrast on white.
       --ink 13.1:1 · --accent 8.1:1 · --soft 6.9:1 · --muted 5.1:1 (all pass WCAG AA) */
    --ink:#0F2F63; --soft:#3F5A8A; --muted:#4A6FA5;
    --bg:#FFFFFF; --surface:#FFFFFF;
    --line:#D6DCE8; --accent:#1E4D9B; --navy:#0F2F63;
    --clay:#A11D2E; --amber:#C43A32;
    --tint:#E8EEF9; --tint-soft:#F2F7FE; --chip-bg:#E7EEF9; --chip-line:#C9D9F0;
    --alert-bg:#FDF2F2; --rail-done:#DCE6F5;
    --placeholder:#5C7BAE; --disabled:#9FB0CC;
    --serif:"Source Serif 4","Iowan Old Style",Georgia,ui-serif,serif;
    --sans:"IBM Plex Sans",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background:#FFFFFF; }
  body { margin:0; background:#FFFFFF; font-family:var(--sans); color:var(--ink); -webkit-text-size-adjust:100%; }
  /* Never let a browser's automatic dark mode invert a clinical record. */
  @media (prefers-color-scheme: dark) {
    html, body, .shell { background:#FFFFFF !important; color:var(--ink) !important; }
  }
  button { font:inherit; cursor:pointer; }

  .shell { min-height:100vh; padding:40px 24px; }
  .wrap { max-width:900px; margin:0 auto; }
  .wrap-narrow { max-width:640px; margin:0 auto; }

  header.app { margin-bottom:34px; }
  .eyebrow-top { font-family:var(--mono); font-size:11px; letter-spacing:.08em; color:var(--accent); text-transform:uppercase; }
  h1.app { font-family:var(--serif); font-size:26px; color:var(--ink); margin:6px 0 0; font-weight:700; line-height:1.2; }
  .byline { font-family:var(--sans); font-size:13px; color:var(--soft); margin-top:4px; }

  .eyebrow { font-family:var(--mono); font-size:12px; letter-spacing:.08em; color:var(--accent); text-transform:uppercase; }
  .eyebrow-soft { font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--soft); text-transform:uppercase; }
  h2.step { font-family:var(--serif); font-size:22px; color:var(--ink); margin:18px 0 0; line-height:1.35; font-weight:600; }
  h2.summary { font-family:var(--serif); font-size:28px; color:var(--ink); margin:8px 0 0; font-weight:700; line-height:1.25; }
  h3.block { font-family:var(--serif); font-size:17px; color:var(--ink); margin:26px 0 0; font-weight:600; }
  p.lede { font-family:var(--sans); font-size:14px; color:var(--soft); margin:8px 0 0; line-height:1.55; }

  .chip { display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase;
    color:var(--navy); background:var(--chip-bg); border:1px solid var(--chip-line); border-radius:4px; padding:3px 7px; }

  .btn-primary { display:inline-flex; align-items:center; gap:8px; font-size:15px; font-weight:700; color:#fff;
    background:var(--navy); border:none; border-radius:8px; padding:13px 26px; }
  .btn-next { display:inline-flex; align-items:center; gap:6px; font-size:14px; font-weight:600; color:#fff;
    background:var(--navy); border:none; border-radius:8px; padding:11px 20px; }
  .btn-back { display:inline-flex; align-items:center; gap:6px; font-size:14px; color:var(--soft); background:transparent; border:none; }
  .btn-back[disabled] { color:var(--disabled); cursor:default; }
  .btn-outline { display:inline-flex; align-items:center; gap:8px; font-size:14px; font-weight:600; color:var(--navy);
    background:transparent; border:1.5px solid var(--navy); border-radius:8px; padding:11px 20px; }
  .btn-quiet { font-family:var(--sans); font-size:13px; font-weight:500; color:var(--soft); background:transparent;
    border:1px solid var(--line); border-radius:8px; padding:8px 14px; }
  .btn-quiet:hover { color:var(--navy); border-color:var(--navy); }

  /* Choice controls — mirrors the app's SingleSelect / MultiSelect */
  .opts { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .opts-row { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  .opt { display:flex; align-items:center; gap:10px; text-align:left; font-size:15px; padding:13px 16px; border-radius:8px;
    border:1.5px solid var(--line); background:var(--surface); color:var(--ink); transition:border-color 120ms ease, background 120ms ease; }
  .opt[aria-pressed="true"] { border-color:var(--navy); background:var(--tint); }
  .opt .mark { flex-shrink:0; width:17px; height:17px; }
  .opt .mark svg { display:block; }
  .opt-compact { padding:12px 22px; font-weight:600; justify-content:center; }
  .opt-compact[aria-pressed="true"] { background:var(--tint); color:var(--navy); border-color:var(--navy); box-shadow:inset 0 0 0 1px var(--navy); }
  .opt-num { min-width:52px; justify-content:center; padding:12px 0; font-family:var(--mono); font-size:15px; font-weight:500; }
  .opt-num[aria-pressed="true"] { background:var(--tint); color:var(--navy); border-color:var(--navy); font-weight:700; box-shadow:inset 0 0 0 1px var(--navy); }

  /* Fields */
  .field { margin-top:16px; }
  .field > label, .flabel { display:block; font-family:var(--sans); font-size:13px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .hint { font-family:var(--sans); font-size:12.5px; color:var(--soft); margin-top:6px; line-height:1.5; }
  input[type=text], input[type=date], input[type=tel], input[type=number], textarea {
    width:100%; font-family:var(--sans); font-size:15px; color:var(--ink); background:var(--surface);
    border:1.5px solid var(--line); border-radius:8px; padding:11px 13px; outline:none; transition:border-color 120ms ease; }
  input:focus, textarea:focus { border-color:var(--navy); }
  input::placeholder, textarea::placeholder { color:var(--placeholder); opacity:1; }
  textarea { resize:vertical; min-height:92px; line-height:1.55; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }

  /* Panels */
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:18px; }
  .hintbox { font-size:14px; line-height:1.6; color:var(--soft); background:var(--tint-soft);
    border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-top:18px; }
  .alertbox { display:flex; gap:10px; margin-top:18px; background:var(--alert-bg); border:1.5px solid #C43A3255;
    border-left:4px solid var(--amber); border-radius:8px; padding:13px 16px; font-size:14px; line-height:1.55; color:var(--ink); }
  .resultcard { background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:20px 22px; margin-top:22px; }
  .bignum { font-family:var(--serif); font-size:40px; color:var(--ink); font-weight:600; line-height:1; }
  .bigunit { font-family:var(--serif); font-size:22px; color:var(--soft); font-weight:500; }

  /* Medications table */
  .medrow { display:grid; grid-template-columns:2fr 1fr 1fr 1.4fr auto; gap:10px; align-items:start; margin-top:10px; }
  .medhead { display:grid; grid-template-columns:2fr 1fr 1fr 1.4fr auto; gap:10px; margin-top:14px;
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); }
  .medhead span:last-child, .medrow > .rm { width:38px; }
  .rm { border:1.5px solid var(--line); background:var(--surface); border-radius:8px; height:44px; color:var(--soft);
    display:flex; align-items:center; justify-content:center; }
  .rm:hover { border-color:var(--amber); color:var(--amber); }

  /* Rail */
  .cols { display:flex; gap:40px; flex-wrap:wrap; }
  .rail { width:210px; flex-shrink:0; }
  .rail-item { display:flex; gap:10px; margin-bottom:20px; background:transparent; border:none; padding:0; text-align:left; width:100%; }
  .rail-num { font-family:var(--mono); font-size:12px; width:22px; height:22px; border-radius:5px; display:flex;
    align-items:center; justify-content:center; flex-shrink:0; border:1px solid var(--line); background:transparent; color:var(--soft); }
  .rail-item[data-state="current"] .rail-num { background:var(--navy); color:#fff; border:none; }
  .rail-item[data-state="done"] .rail-num { background:var(--rail-done); color:var(--navy); border:none; }
  .rail-item[data-state="todo"] { opacity:.6; }
  .rail-label { font-family:var(--sans); font-size:13px; font-weight:500; color:var(--ink); }
  .rail-item[data-state="current"] .rail-label { font-weight:700; }
  .rail-tag { font-family:var(--mono); font-size:10px; color:var(--soft); margin-top:2px; }
  .body-col { flex:1; min-width:0; max-width:560px; }

  .nav { display:flex; justify-content:space-between; align-items:center; margin-top:30px; }
  .divider { border-top:1px solid var(--line); margin-top:26px; padding-top:18px; }

  /* Summary */
  .srow { display:flex; justify-content:space-between; gap:18px; padding:9px 0; border-top:1px solid var(--line); }
  .srow:first-child { border-top:none; }
  .skey { font-size:13.5px; color:var(--soft); line-height:1.45; }
  .sval { font-size:13.5px; color:var(--ink); font-weight:600; text-align:right; max-width:52%; }
  .sval.empty { color:var(--muted); font-weight:400; }
  .flag { display:flex; gap:9px; padding:9px 0; font-size:13.5px; line-height:1.5; color:var(--ink); }

  a { color:var(--accent); }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

  @media (max-width:700px) {
    .shell { padding:28px 18px; }
    .rail { width:100%; display:flex; flex-wrap:wrap; gap:6px 12px; }
    .rail-item { width:auto; margin-bottom:6px; }
    .rail-label, .rail-tag { display:none; }
    .cols { gap:22px; }
    .grid2, .grid3 { grid-template-columns:1fr; gap:14px; }
    .medhead { display:none; }
    .medrow { grid-template-columns:1fr; gap:8px; background:var(--surface); border:1px solid var(--line);
      border-radius:8px; padding:12px; margin-top:12px; }
    .medrow > .rm { width:100%; }
  }
  /* IOSN rank descriptors and MDAS anchors */
  .rankopt { align-items:flex-start; gap:12px; padding:14px 16px; }
  .rankno { flex-shrink:0; width:26px; height:26px; border-radius:6px; background:var(--tint);
    color:var(--navy); font-family:var(--mono); font-size:13px; font-weight:500;
    display:flex; align-items:center; justify-content:center; }
  .opt[aria-pressed="true"] .rankno { background:var(--navy); color:#fff; }
  .ranktitle { display:block; font-weight:600; font-size:15px; }
  .rankdetail { display:block; font-size:13px; line-height:1.5; color:var(--soft); margin-top:4px; }
  .mdasopt { padding:10px 14px; gap:9px; font-size:14px; }
  .mdasopt .rankno { width:22px; height:22px; font-size:12px; }

    color:var(--muted); border:1px solid var(--line); border-radius:3px; padding:1px 4px; margin-left:5px; }
  .sbval { font-weight:600; color:var(--muted); }
  .sbval[data-yes="true"] { color:var(--clay); }
  .sbval[data-asked="false"] { color:var(--placeholder); font-weight:400; }

  /* Computed age */
  .agechip { display:inline-block; margin-top:12px; font-size:13.5px; color:var(--navy);
    background:var(--tint); border:1px solid var(--chip-line); border-radius:8px; padding:8px 13px; }

  .sec { display:block; }

  /* Outcome band — the decision, stated once, at the top */
  .outcome { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
    border:1.5px solid var(--line); border-left-width:5px; border-radius:8px;
    padding:11px 14px; margin-top:14px; }
  .outcome-verdict { font-family:var(--serif); font-size:17px; font-weight:600; }
  .outcome-detail { font-size:13.5px; color:var(--soft); }
  .outcome[data-tone="go"]      { border-color:var(--line); border-left-color:var(--accent); }
  .outcome[data-tone="go"] .outcome-verdict { color:var(--navy); }
  .outcome[data-tone="stop"]    { border-color:#A11D2E33; border-left-color:var(--clay); background:var(--alert-bg); }
  .outcome[data-tone="stop"] .outcome-verdict { color:var(--clay); }
  .outcome[data-tone="pending"] { border-color:var(--line); border-left-color:var(--muted); }
  .outcome[data-tone="pending"] .outcome-verdict { color:var(--muted); }

  /* Severity-ranked advisory flags */
  .flaggroup { margin-top:14px; }
  .flaggroup:first-of-type { margin-top:12px; }
  .flaghead { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; }
  .flagcount { display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; padding:0 5px; border-radius:5px;
    font-family:var(--mono); font-size:11px; font-weight:500; }
  .flagnote { font-size:12px; color:var(--soft); margin-top:3px; line-height:1.4; }
  .flaggroup .flaglist { margin-top:7px; }
  .flagdot { flex-shrink:0; width:5px; height:5px; border-radius:50%; margin-top:7px; }

  .flaggroup[data-level="stop"]   .flaghead  { color:var(--clay); }
  .flaggroup[data-level="stop"]   .flagcount { background:var(--clay); color:#fff; }
  .flaggroup[data-level="stop"]   .flagdot   { background:var(--clay); }
  .flaggroup[data-level="stop"]   .flag      { font-weight:600; }
  .flaggroup[data-level="review"] .flaghead  { color:var(--amber); }
  .flaggroup[data-level="review"] .flagcount { background:var(--amber); color:#fff; }
  .flaggroup[data-level="review"] .flagdot   { background:var(--amber); }
  .flaggroup[data-level="note"]   .flaghead  { color:var(--soft); }
  .flaggroup[data-level="note"]   .flagcount { background:var(--line); color:var(--ink); }
  .flaggroup[data-level="note"]   .flagdot   { background:var(--muted); }

  /* Allergy banner — the record's most safety-critical field, always visible */
  .allergy-bar { display:flex; gap:10px; align-items:flex-start; border-radius:8px;
    padding:11px 14px; margin-bottom:18px; font-size:14px; line-height:1.5; border:1.5px solid; }
  .allergy-bar[data-tone="alert"] { background:var(--alert-bg); border-color:var(--clay); color:var(--clay); }
  .allergy-bar[data-tone="warn"]  { background:#FFF8E8; border-color:#B07A12; color:#7A5209; }
  .allergy-bar[data-tone="ok"]    { background:var(--tint-soft); border-color:var(--line); color:var(--soft); }
  .allergy-bar .ab-icon { flex-shrink:0; display:inline-flex; margin-top:1px; }
  .allergy-bar .ab-detail { font-weight:400; }

  /* Confirmation dialog */
  .overlay { position:fixed; inset:0; background:rgba(16,30,61,.45); display:flex;
    align-items:center; justify-content:center; padding:22px; z-index:50; }
  .dialog { background:#fff; border:1.5px solid var(--line); border-radius:12px;
    padding:24px; max-width:460px; width:100%; }

  /* Typed attestation */
  .typedwrap { border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; }
  .typedsig { font-family:var(--serif); font-size:26px; font-style:italic; color:var(--ink);
    margin-top:10px; padding-bottom:6px; }
  .typedsig.shown { border-bottom:1px solid var(--line); margin-top:6px; }

  /* Print-only header and footer */
  .print-head, .print-foot { display:none; }

  /* Systems enquiry groups */
  .hgroup { margin-top:20px; }
  .hgroup:first-of-type { margin-top:14px; }

  /* Integrity notices */
  .voidnote { font-size:13px; line-height:1.5; color:var(--clay); background:var(--alert-bg);
    border:1px solid #A11D2E33; border-left:3px solid var(--clay); border-radius:8px;
    padding:10px 13px; margin-bottom:10px; }

  /* Draft opt-in */
  .draftbar { display:flex; align-items:flex-start; gap:12px; justify-content:space-between;
    border:1px solid var(--line); border-radius:8px; padding:13px 16px; margin-top:18px; flex-wrap:wrap; }
  .switch { display:inline-flex; align-items:center; gap:9px; font-size:14px; font-weight:600;
    color:var(--ink); background:transparent; border:none; padding:0; }
  .switch .box { width:19px; height:19px; border-radius:5px; border:1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .switch[aria-pressed="true"] .box { background:var(--accent); border-color:var(--accent); }

  @media (display-mode: standalone) { .install-hint { display:none !important; } }

  /* Signatures */
  .sigblock { margin-top:22px; break-inside:avoid; page-break-inside:avoid; }
  .declaration { font-size:14px; line-height:1.6; color:var(--soft); background:var(--tint-soft);
    border:1px solid var(--line); border-radius:8px; padding:13px 16px; margin:10px 0 0; }
  .sigwrap { margin-top:12px; }
  .sigpad { display:block; width:100%; height:150px; background:#FFFFFF; border:1.5px solid var(--line);
    border-radius:8px; touch-action:none; cursor:crosshair; }
  .sigpad:focus-visible { border-color:var(--accent); }
  .sigshow { display:block; width:100%; height:110px; background:#FFFFFF;
    border-bottom:1px solid var(--line); border-radius:0; }
  .sigline { height:64px; border-bottom:1px solid var(--line); }
  .sigmeta { display:flex; justify-content:space-between; align-items:flex-end; gap:12px; margin-top:8px; }
  .signame { font-size:14px; font-weight:600; color:var(--ink); }
  .sigtime { font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--muted); margin-top:3px; }
  .sigtime[data-signed="true"] { color:var(--accent); }

  @media (max-width:700px) {
    .sigpad { height:130px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }

  @page { margin:11mm; }
  @media print {
    /* Density: the record is a clinical document, not a screen. Every rule here
       exists to fit it onto as few sheets as possible without losing content. */
    .spa-noprint { display:none !important; }
    body, .shell { background:#fff !important; padding:0 !important; }
    .shell { padding-top:13px !important; }
    .wrap, .wrap-narrow { max-width:none !important; }
    body { font-size:9.5pt; -webkit-print-color-adjust:exact; print-color-adjust:exact; }

    /* Masthead. On screen the title, an eyebrow and a section label all appear;
       in print they say the same thing three times, so only the title and the
       patient identity block are kept. */
    header.app { margin-bottom:0 !important; }
    .eyebrow-top { display:none !important; }
    .eyebrow { display:none !important; }
    h1.app { font-size:11pt !important; font-weight:600 !important; margin:0 !important;
      color:var(--soft) !important; letter-spacing:.01em; }
    h2.summary { font-size:15pt !important; margin:7px 0 0 !important; line-height:1.15 !important; }
    .byline { font-size:8pt !important; margin-top:2px !important;
      padding-bottom:7px; border-bottom:1.5px solid var(--navy); }

    /* Section headings sit on a rule, so the eye finds them at a glance */
    h3.block { font-size:9.5pt !important; font-weight:700 !important;
      text-transform:uppercase; letter-spacing:.06em; color:var(--accent) !important;
      margin:11px 0 0 !important; padding-bottom:2px; border-bottom:1px solid var(--line);
      break-after:avoid; page-break-after:avoid; }

    /* The advisory list is the longest block on the page — run it in two columns */
    .outcome { padding:6px 10px !important; margin-top:7px !important;
      border-left-width:4px !important; break-inside:avoid; }
    .outcome-verdict { font-size:11.5pt !important; }
    .outcome-detail { font-size:8.5pt !important; }
    .flaggroup { margin-top:8px !important; break-inside:avoid; page-break-inside:avoid; }
    .flaghead { font-size:8pt !important; }

<script>

var VERSION = "0.1.0";

var I = {

  radioOff: svg('<circle cx="12" cy="12" r="10"/>'),

  plus:     svg('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>', 15),
  trash:    svg('<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>', 16),

  alert:    svg('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>', 16),

};

/* ---------- Option sets ---------- */
var ASA = [
  { id: "I",   label: "ASA I — Healthy" },
  { id: "II",  label: "ASA II — Mild systemic disease" },
  { id: "III", label: "ASA III — Severe systemic disease" },
  { id: "IV",  label: "ASA IV — Incapacitating disease" }
];
var MALLAMPATI = ["I", "II", "III", "IV"];
var MOUTH_OPENING = [">3cm", "2–3cm", "<2cm"];
var NECK = ["Normal", "Limited", "Immobile"];
var YESNO = ["Yes", "No"];
var GAG = ["None", "Mild", "Moderate", "Severe"];
var DRUGS = ["None", "Cannabis", "Cocaine", "MDMA", "Opioids", "Other"];
var SMOKING = ["Non", "Ex", "Current"];
var INDICATIONS = ["Dental phobia / anxiety", "Gag reflex", "Medical condition",
                   "Learning disability", "Extensive treatment", "Failed LA"];
var TECHNIQUE = ["IV Midazolam", "IV Remimazolam", "Inhalation", "Other"];

var ARRANGEMENTS = [
  "Responsible adult escort confirmed",
  "Escort able to stay for the rest of the day",
  "Transport home arranged",
  "Fasting instructions given",
  "Written pre- and post-operative instructions provided",
  "Advised not to drive or sign legal documents for 24 hours",
  "Care of dependents arranged"
];

var MDAS_QUESTIONS = [
  { id: "q1", text: "Going to the dentist tomorrow?" },
  { id: "q2", text: "Sitting in the waiting room?" },
  { id: "q3", text: "About to have a tooth drilled?" },
  { id: "q4", text: "About to have teeth scaled and polished?" },
  { id: "q5", text: "About to have a local anaesthetic injection?" }
];

/* Systems enquiry. Items marked `flag` raise a prompt on the summary. */
var HISTORY_GROUPS = [
  { title: "Cardiovascular", items: [
    { id: "hypertension", label: "Hypertension" },
    { id: "angina", label: "Angina", flag: "Angina — confirm stability and that a GTN spray is available." },
    { id: "mi", label: "Previous heart attack", flag: "Previous myocardial infarction — confirm interval and current function." },
    { id: "arrhythmia", label: "Arrhythmia", flag: "Arrhythmia recorded — review rhythm control before sedation." },
    { id: "heartFailure", label: "Heart failure", flag: "Heart failure — assess functional capacity and posture tolerance." },
    { id: "pacemaker", label: "Pacemaker or ICD", flag: "Pacemaker or ICD in situ — check device type and any precautions." },
    { id: "stroke", label: "Stroke or TIA" }
  ]},
  { title: "Respiratory", items: [
    { id: "asthma", label: "Asthma", flag: "Asthma — confirm control and that an inhaler is brought to the appointment." },
    { id: "copd", label: "COPD", flag: "COPD — reduced respiratory reserve. Consider hospital-based care." },
    { id: "recentURTI", label: "Recent chest or throat infection", flag: "Recent respiratory infection — consider deferring sedation." }
  ]},
  { title: "Endocrine & metabolic", items: [
    { id: "diabetes", label: "Diabetes", flag: "Diabetes — plan appointment timing, fasting, and glucose monitoring." },
    { id: "steroids", label: "Long-term steroids", flag: "Long-term steroids — consider adrenal suppression and cover." }
  ]},
  { title: "Neurological & mental health", items: [
    { id: "epilepsy", label: "Epilepsy", flag: "Epilepsy — confirm seizure frequency, triggers, and rescue medication." },
    { id: "learningDisability", label: "Learning disability" },
    { id: "mentalHealth", label: "Mental health condition" },
    { id: "dementia", label: "Cognitive impairment or dementia" }
  ]},
  { title: "Gastrointestinal, liver & kidney", items: [
    { id: "reflux", label: "Acid reflux or hiatus hernia", flag: "Reflux — raised aspiration risk; consider positioning and airway protection." },
    { id: "liver", label: "Liver disease", flag: "Liver disease — sedative metabolism may be prolonged; review dosing." },
    { id: "kidney", label: "Kidney disease", flag: "Kidney disease — review drug clearance and dosing." }
  ]},
  { title: "Blood & bleeding", items: [
    { id: "anticoagulant", label: "Anticoagulant or antiplatelet", flag: "On anticoagulant or antiplatelet — check INR or last dose and bleeding plan." },
    { id: "bleedingDisorder", label: "Bleeding disorder", flag: "Bleeding disorder — liaise with haematology before treatment." }
  ]},
  { title: "Other", items: [
    { id: "latex", label: "Latex allergy", flag: "Latex allergy — confirm a latex-free environment." },
    { id: "none", label: "No significant medical history", exclusive: true }
  ]}
];

function historyItem(id) {
  for (var g = 0; g < HISTORY_GROUPS.length; g++) {
    for (var i = 0; i < HISTORY_GROUPS[g].items.length; i++) {
      if (HISTORY_GROUPS[g].items[i].id === id) return HISTORY_GROUPS[g].items[i];
    }
  }
  return null;
}

/* ---------- State (session only) ---------- */
var state = {
  step: 0,
  furthest: 0,
  view: "intro",           // intro | form | summary
  a: {},                   // answers
  meds: [{ name: "", dose: "", freq: "", reason: "" }],
  /* Signatures are stored as normalised stroke paths (0–1 of the pad), so they
     survive re-renders and redraw crisply at any size or pixel density.
     `snapshot` records the state of the form at the moment of signing. */
  sig: {
    patient:   { strokes: [], signedAt: null, snapshot: null, voidedAt: null },
    clinician: { strokes: [], signedAt: null, snapshot: null, voidedAt: null }
  },
  keepDraft: false,         // opt-in only; see saveDraft()
  recordId: null,           // provenance stamp on the printed record
  confirm: null,            // pending destructive action
  notice: null
};

function get(k) { return state.a[k]; }
function set(k, v) {
  state.a[k] = v;
  /* Date of birth is a means to an end. Derive age immediately so the record
     can carry the age without ever retaining the date itself. */
  if (k === "dob" || k === "date") deriveAge();
  /* Pregnancy questions only apply to female patients; drop any stale answers
     rather than leaving them to drive flags invisibly. */
  if (k === "sex" && v !== "Female") {
    delete state.a.pregnancy; delete state.a.trimester; delete state.a.breastfeeding;
  }
  touchRecord();
}

/* ---------- Data minimisation ----------
   Nothing that identifies the patient is written to the device or to an export.
   These fields are held for the working session and carried onto the printed
   record, and are then gone. Age is derived and stored in place of the date of
   birth, so the clinical content of a draft still makes sense on its own. */
var PRIVATE_FIELDS = [
  "name", "dob",                       // patient
  "address", "phone",                  // patient contact
  "escortName", "escortPhone",         // escort / chaperone
  "patientTypedName"                   // typed attestation reproduces the name
];

function withoutPrivateFields(answers) {
  var out = {};
  Object.keys(answers).forEach(function (k) {
    if (PRIVATE_FIELDS.indexOf(k) < 0) out[k] = answers[k];
  });
  return out;
}

/* A signature is identifying in its own right, so it is never persisted either.
   Little is lost: any amendment voids a signature anyway, so a resumed draft
   would almost always need re-signing. Signatures belong to the printed record. */
function blankSignatures() {
  return {
    patient:   { strokes: [], signedAt: null, snapshot: null, voidedAt: null },
    clinician: { strokes: [], signedAt: null, snapshot: null, voidedAt: null }
  };
}

function deriveAge() {
  var a = ageFromDOB();
  if (a != null) state.a.ageYears = a;
}

/* ---------- Record integrity ----------
   A signature attests to the record as it stood when it was given. If any
   clinical content changes afterwards, the signature no longer represents
   what was signed, so it is voided and must be renewed. */

function recordFingerprint() {
  return JSON.stringify([state.a, state.meds]);
}

function touchRecord() {
  var now = recordFingerprint();
  ["patient", "clinician"].forEach(function (role) {
    var s = state.sig[role];
    if (!s.strokes.length || !s.snapshot) return;
    if (s.snapshot !== now) {
      state.sig[role] = {
        strokes: [], signedAt: null, snapshot: null,
        voidedAt: new Date().toISOString()
      };
    }
  });
  saveDraft();
}

/* A record is attested either by a drawn signature or a typed name */
function attested(role) {
  return state.sig[role].strokes.length > 0 || !!(get(role + "TypedName") || "").trim();
}

function anyVoided() {
  return ["patient", "clinician"].filter(function (r) { return state.sig[r].voidedAt; });
}

/* ---------- Draft persistence ----------
   Off by default. This form holds identifiable patient data, so a copy is only
   written to the device when the clinician explicitly asks for one — and it can
   be deleted from within the form at any time. */

var DRAFT_KEY = "sedation.draft.v1";

function storageAvailable() {
  try {
    localStorage.setItem("__t", "1");
    localStorage.removeItem("__t");
    return true;
  } catch (e) { return false; }
}

/* Writing the whole record on every keystroke is needlessly expensive once
   signature strokes are held in state, so coalesce writes. */
var draftTimer = null;
function saveDraft() {
  if (!state.keepDraft) return;
  if (draftTimer) clearTimeout(draftTimer);
  draftTimer = setTimeout(saveDraftNow, 400);
}

function saveDraftNow() {
  draftTimer = null;
  if (!state.keepDraft || !storageAvailable()) return;
  try {
    localStorage.setItem(DRAFT_KEY, JSON.stringify({
      a: withoutPrivateFields(state.a), meds: state.meds, sig: blankSignatures(),
      step: state.step, furthest: state.furthest, recordId: state.recordId,
      savedAt: new Date().toISOString()
    }));
  } catch (e) { /* quota or private mode — the form still works in memory */ }
}

function loadDraft() {
  if (!storageAvailable()) return null;
  try {
    var raw = localStorage.getItem(DRAFT_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function discardDraft() {
  if (storageAvailable()) { try { localStorage.removeItem(DRAFT_KEY); } catch (e) {} }
}

function restoreDraft(d) {
  state.a = d.a || {};
  state.meds = (d.meds && d.meds.length) ? d.meds : [{ name: "", dose: "", freq: "", reason: "" }];
  state.sig = blankSignatures();     // signatures are not retained; re-sign after resuming
  state.step = d.step || 0;
  state.furthest = d.furthest || 0;
  state.recordId = d.recordId || state.recordId || newRecordId();
  state.keepDraft = true;
}

/* Has anything been entered worth warning about? */
var AUTO_FILLED = ["date", "units"];   // set by the form, not typed by the user
function hasContent() {
  if (Object.keys(state.a).filter(function (k) { return AUTO_FILLED.indexOf(k) < 0; }).some(function (k) {
    var v = state.a[k];
    return v !== undefined && v !== "" && !(Array.isArray(v) && !v.length);
  })) return true;
  if (state.meds.some(function (m) { return m.name || m.dose || m.freq || m.reason; })) return true;
  return state.sig.patient.strokes.length > 0 || state.sig.clinician.strokes.length > 0;
}

window.addEventListener("beforeunload", function (e) {
  if (state.view === "intro" || !hasContent() || state.keepDraft) return;
  e.preventDefault();
  e.returnValue = "";
  return "";
});

/* ============================================================
   CLINICAL CALCULATIONS
   ============================================================ */

/* BMI — metric or imperial input, WHO categories */
function computeBMI() {
  var kg = null, m = null;
  if (get("units") === "imperial") {
    var st = parseFloat(get("wtSt")), lb = parseFloat(get("wtLb"));
    var ft = parseFloat(get("htFt")), inch = parseFloat(get("htIn"));
    if (!isNaN(st) || !isNaN(lb)) kg = ((isNaN(st) ? 0 : st) * 6.35029) + ((isNaN(lb) ? 0 : lb) * 0.453592);
    if (!isNaN(ft) || !isNaN(inch)) m = (((isNaN(ft) ? 0 : ft) * 12) + (isNaN(inch) ? 0 : inch)) * 0.0254;
  } else {
    var w = parseFloat(get("wtKg")), h = parseFloat(get("htCm"));
    if (!isNaN(w)) kg = w;
    if (!isNaN(h)) m = h / 100;
  }
  if (!kg || !m || kg <= 0 || m <= 0) return null;
  var bmi = kg / (m * m);
  if (!isFinite(bmi) || bmi <= 0 || bmi > 200) return null;
  return { bmi: bmi, kg: kg, m: m };
}

function bmiCategory(bmi) {
  if (bmi < 18.5)  return { label: "Underweight",        tone: "watch" };
  if (bmi < 25)    return { label: "Healthy weight",     tone: "ok" };
  if (bmi < 30)    return { label: "Overweight",         tone: "ok" };
  if (bmi < 35)    return { label: "Obesity class I",    tone: "watch" };
  if (bmi < 40)    return { label: "Obesity class II",   tone: "alert" };
  return             { label: "Obesity class III",  tone: "alert" };
}

/* MDAS — five items scored 1–5, total out of 25 */
function mdasTotal() {
  var sum = 0, answered = 0;
  MDAS_QUESTIONS.forEach(function (q) {
    var v = get("mdas_" + q.id);
    if (typeof v === "number") { sum += v; answered++; }
  });
  return { sum: sum, answered: answered, complete: answered === MDAS_QUESTIONS.length };
}

/* IOSN Part 1 is banded from the MDAS total. Derived, and overridable.
   Bands per Coulthard et al., IOSN guidance (Dental Update 2013, Table 2):
   MDAS 5–9 minimal = 1 · 10–12 moderate = 2 · 13–17 high = 3 · 18–25 very high = 4 */
function iosnAnxietyFromMDAS(total) {
  if (total >= 18) return 4;
  if (total >= 13) return 3;
  if (total >= 10) return 2;
  return 1;
}

function iosnParts() {
  var m = mdasTotal();
  var derived = m.complete ? iosnAnxietyFromMDAS(m.sum) : null;
  var override = get("iosn1Override");
  var p1 = (typeof override === "number") ? override : derived;
  var p2 = get("iosn2");
  var p3 = get("iosn3");
  return { p1: p1, p2: p2, p3: p3, derived: derived, overridden: typeof override === "number" };
}

function iosnTotal() {
  var p = iosnParts();
  if (typeof p.p1 !== "number" || typeof p.p2 !== "number" || typeof p.p3 !== "number") return null;
  return p.p1 + p.p2 + p.p3;
}

function iosnBand(total) {
  if (total <= 4)  return { label: "Minimal",   tone: "ok",    color: "var(--line)" };
  if (total <= 6)  return { label: "Moderate",  tone: "ok",    color: "var(--accent)" };
  if (total <= 9)  return { label: "High",      tone: "watch", color: "var(--amber)" };
  return             { label: "Very high", tone: "alert", color: "var(--clay)" };
}

/* Age at assessment. Once derived it is stored in its own right, so the record
   still knows the age after the date of birth has been discarded. */
function computeAge() {
  var a = ageFromDOB();
  if (a != null) return a;
  var stored = parseInt(get("ageYears"), 10);
  return isNaN(stored) ? null : stored;
}

function ageFromDOB() {
  var dob = get("dob");
  if (!dob) return null;
  var b = new Date(dob);
  if (isNaN(b.getTime())) return null;
  var ref = get("date") ? new Date(get("date")) : new Date();
  if (isNaN(ref.getTime())) ref = new Date();
  var age = ref.getFullYear() - b.getFullYear();
  var m = ref.getMonth() - b.getMonth();
  if (m < 0 || (m === 0 && ref.getDate() < b.getDate())) age--;
  return (age >= 0 && age < 130) ? age : null;
}

/* Advisory flags — prompts for clinician consideration, not determinations */
function clinicalFlags() {
  var f = [];
  var asa = get("asa");
  if (asa === "III") f.push({ level: "review", text: "ASA III — severe systemic disease. Confirm suitability for conscious sedation in this setting." });
  if (asa === "IV")  f.push({ level: "stop", text: "ASA IV — incapacitating disease. Conscious sedation in primary care is not usually appropriate." });

  var b = computeBMI();
  if (b) {
    if (b.bmi >= 40) f.push({ level: "review", text: "BMI " + b.bmi.toFixed(1) + " — obesity class III. Consider hospital-based care." });
    else if (b.bmi >= 35) f.push({ level: "review", text: "BMI " + b.bmi.toFixed(1) + " — obesity class II. Consider hospital-based care." });
    else if (b.bmi >= 30) f.push({ level: "review", text: "BMI " + b.bmi.toFixed(1) + " — obesity class I. Consider hospital-based care." });
  }

  if (get("mallampati") === "III" || get("mallampati") === "IV")
    f.push({ level: "review", text: "Mallampati " + get("mallampati") + " — anticipated difficult airway view." });
  if (get("mouthOpening") === "<2cm") f.push({ level: "review", text: "Mouth opening under 2cm — significant access and airway limitation." });
  else if (get("mouthOpening") === "2–3cm") f.push({ level: "review", text: "Reduced mouth opening (2–3cm) — anticipate restricted access." });
  if (get("neck") === "Immobile") f.push({ level: "review", text: "Neck immobile — airway positioning will be limited." });
  else if (get("neck") === "Limited") f.push({ level: "review", text: "Limited neck mobility — airway positioning may be restricted." });
  if (get("facialAbn") === "Yes") f.push({ level: "review", text: "Facial or jaw abnormality recorded — review airway management plan." });

  var mt = mdasTotal();
  if (mt.complete && mt.sum >= 19) f.push({ level: "review", text: "MDAS " + mt.sum + "/25 — indicates severe dental anxiety." });

  var drugs = get("drugs") || [];
  if (drugs.indexOf("Opioids") >= 0) f.push({ level: "review", text: "Opioid use reported — consider tolerance and interaction with sedative agents." });
  if (drugs.indexOf("Cocaine") >= 0) f.push({ level: "review", text: "Cocaine use reported — cardiovascular risk. Confirm abstinence interval before sedation." });

  var units = parseFloat(get("alcohol"));
  if (!isNaN(units) && units > 14) f.push({ level: "note", text: "Alcohol " + units + " units/week — above UK low-risk guideline; consider tolerance to sedative agents." });

  /* Systems enquiry */
  (get("history") || []).forEach(function (id) {
    var item = historyItem(id);
    if (item && item.flag) f.push({ level: "review", text: item.flag });
  });
  if (get("anaesProblem") === "Yes") f.push({ level: "review", text: "Previous problem with anaesthesia or sedation — review the details before proceeding." });
  if (get("anaesFamily") === "Yes") f.push({ level: "review", text: "Family history of anaesthetic problems — consider malignant hyperthermia risk and seek advice." });

  /* Baseline observations */
  var sys = parseFloat(get("bpSys")), dia = parseFloat(get("bpDia"));
  if (!isNaN(sys) && !isNaN(dia)) {
    if (sys >= 180 || dia >= 120) f.push({ level: "stop", text: "Blood pressure " + sys + "/" + dia + " — severely raised. Do not sedate; arrange urgent medical review." });
    else if (sys >= 160 || dia >= 100) f.push({ level: "review", text: "Blood pressure " + sys + "/" + dia + " — raised. Recheck and consider deferring pending medical review." });
    else if (sys < 90) f.push({ level: "review", text: "Blood pressure " + sys + "/" + dia + " — low. Establish the cause before sedation." });
  }
  var pulse = parseFloat(get("pulse"));
  if (!isNaN(pulse)) {
    if (pulse > 100) f.push({ level: "review", text: "Pulse " + pulse + " bpm — tachycardic. Establish the cause before sedation." });
    else if (pulse < 50) f.push({ level: "review", text: "Pulse " + pulse + " bpm — bradycardic. Establish the cause before sedation." });
  }
  var spo2 = parseFloat(get("spo2"));
  if (!isNaN(spo2) && spo2 < 95) f.push({ level: "review", text: "Oxygen saturation " + spo2 + "% — below 95% on air. Investigate before sedation." });

  /* Escort and discharge arrangements */
  var ivPlanned = get("technique") && get("technique").indexOf("IV") === 0;
  var arranged = get("arrangements") || [];
  var pending = ARRANGEMENTS.filter(function (a) { return arranged.indexOf(a) < 0; });
  if (ivPlanned && arranged.indexOf(ARRANGEMENTS[0]) < 0)
    f.push({ level: "stop", text: "No escort confirmed for a planned intravenous technique — the appointment should not proceed as arranged." });
  if (pending.length)
    f.push({ level: "review", text: "Arrangements outstanding: " + pending.join("; ").toLowerCase() + "." });

  /* Age */
  var age = computeAge();
  if (age != null) {
    if (age < 18) f.push({ level: "stop", text: "Age " + age + " — under 18 and outside the scope of this form. Use your paediatric sedation pathway." });
    else if (age >= 80) f.push({ level: "review", text: "Age " + age + " — consider reduced sedative dosing and slower titration." });
    else if (age >= 65) f.push({ level: "note", text: "Age " + age + " — older adults are more sensitive to sedative agents; titrate cautiously." });
  }

  if (get("osa") === "Yes")
    f.push({ level: "review", text: "Obstructive sleep apnoea or snoring reported — heightened risk of airway obstruction under sedation." });

  /* Airway extras */
  if (get("mallampati") === "Unable to assess") f.push({ level: "review", text: "Mallampati could not be assessed — plan for an unpredicted difficult airway." });
  if (get("beard") === "Yes") f.push({ level: "note", text: "Beard or heavy facial hair — may compromise nasal mask seal for inhalation sedation." });
  var dent = get("dentition") || [];
  if (dent.indexOf("Loose teeth") >= 0) f.push({ level: "review", text: "Loose teeth recorded — aspiration risk. Document and consider stabilising before sedation." });
  if (dent.indexOf("Removable denture") >= 0) f.push({ level: "note", text: "Removable denture — agree before treatment whether it stays in or out." });

  /* Pregnancy and technique interaction */
  var preg = get("pregnancy");
  var tech = get("technique") || "";
  if (preg === "Yes" || preg === "Possible / unsure") {
    var word = preg === "Yes" ? "Pregnancy" : "Possible pregnancy";
    if (tech.indexOf("Midazolam") >= 0)
      f.push(word + " with IV midazolam planned — midazolam is generally avoided throughout pregnancy. Review the technique.");
    else if (tech.indexOf("Remimazolam") >= 0)
      f.push(word + " with IV remimazolam planned — safety in pregnancy is not established. Review the technique.");
    else if (tech === "Inhalation" && get("trimester") === "First trimester")
      f.push(word + " in the first trimester — elective nitrous oxide is contraindicated at this stage.");
    else
      f.push(word + " recorded — review the sedation technique and timing, and seek specialist advice.");
  }
  if (get("breastfeeding") === "Yes") f.push({ level: "note", text: "Breastfeeding — advise on timing of feeds relative to sedation." });

  /* Capacity */
  if (get("capacity") === "No")
    f.push({ level: "stop", text: "Patient lacks capacity to consent — a documented best-interests decision is required before treatment." });

  return f;
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

/* Single-select list, styled as the parent app's SingleSelect */
function radioList(key, options, opts) {
  opts = opts || {};
  var cur = get(key);
  var cls = opts.row ? "opts-row" : "opts";
  /* Roving tabindex: the group is a single tab stop and arrows move within it,
     which is what assistive technology expects of a radio group. */
  var idx = 0;
  options.forEach(function (o, i) {
    if ((typeof o === "string" ? o : o.id) === cur) idx = i;
  });
  var html = '<div class="' + cls + '" role="radiogroup" data-roving="1">';
  options.forEach(function (o, i) {
    var id = typeof o === "string" ? o : o.id;
    var label = typeof o === "string" ? o : o.label;
    var on = cur === id;
    var btnCls = "opt" + (opts.compact ? " opt-compact" : "");
    html += '<button type="button" class="' + btnCls + '" role="radio" aria-checked="' + on + '" aria-pressed="' + on + '"' +
            ' tabindex="' + (i === idx ? "0" : "-1") + '"' +
            ' data-act="radio" data-key="' + esc(key) + '" data-val="' + esc(id) + '">' +
            (opts.compact ? "" : '<span class="mark" style="color:' + (on ? "var(--accent)" : "var(--placeholder)") +
              '">' + (on ? I.radioOn : I.radioOff) + "</span>") +
            "<span>" + esc(label) + "</span></button>";
  });
  return html + "</div>";
}

/* Multi-select list */
function checkList(key, options) {
  var cur = get(key) || [];
  var html = '<div class="opts">';
  options.forEach(function (o) {
    var on = cur.indexOf(o) >= 0;
    html += '<button type="button" class="opt" aria-pressed="' + on + '"' +
            ' data-act="toggle" data-key="' + esc(key) + '" data-val="' + esc(o) + '">' +
            '<span class="mark" style="color:' + (on ? "var(--accent)" : "var(--placeholder)") + (on ? "" : "") + '">' +
            (on ? I.checkOn : I.checkOff) + "</span><span>" + esc(o) + "</span></button>";
  });
  return html + "</div>";
}

/* Numeric scale row, e.g. MDAS 1–5 or IOSN 1–4 */
function numScale(key, from, to) {
  var cur = get(key);
  var html = '<div class="opts-row" role="radiogroup" data-roving="1" style="margin-top:10px;gap:8px;">';
  var first = (cur == null) ? from : cur;
  for (var n = from; n <= to; n++) {
    var on = cur === n;
    html += '<button type="button" class="opt opt-num" role="radio" aria-checked="' + on + '"' +
            ' aria-pressed="' + on + '" aria-label="' + n + '"' +
            ' tabindex="' + (n === first ? "0" : "-1") + '"' +
            ' data-act="num" data-key="' + esc(key) + '" data-val="' + n + '">' + n + "</button>";
  }
  return html + "</div>";
}

function textField(key, label, opts) {
  opts = opts || {};
  var type = opts.type || "text";
  return '<div class="field"><label for="f_' + esc(key) + '">' + esc(label) + "</label>" +
    '<input id="f_' + esc(key) + '" type="' + type + '" data-field="' + esc(key) + '"' +
    (opts.numeric ? ' inputmode="decimal"' : "") +
    (opts.placeholder ? ' placeholder="' + esc(opts.placeholder) + '"' : "") +
    (opts.min != null ? ' min="' + opts.min + '"' : "") +
    (opts.max != null ? ' max="' + opts.max + '"' : "") +
    (opts.step != null ? ' step="' + opts.step + '"' : "") + " />" +
    (opts.hint ? '<div class="hint">' + esc(opts.hint) + "</div>" : "") + "</div>";
}

function textArea(key, label, placeholder) {
  return '<div class="field"><label for="f_' + esc(key) + '">' + esc(label) + "</label>" +
    '<textarea id="f_' + esc(key) + '" data-field="' + esc(key) + '"' +
    (placeholder ? ' placeholder="' + esc(placeholder) + '"' : "") + "></textarea></div>";
}

/* MDAS response anchors, per Humphris et al. as reproduced in the IOSN guidance */
var MDAS_ANCHORS = [
  { value: 1, label: "Not anxious" },
  { value: 2, label: "Slightly anxious" },
  { value: 3, label: "Fairly anxious" },
  { value: 4, label: "Very anxious" },
  { value: 5, label: "Extremely anxious" }
];

/* IOSN rank descriptors, per Coulthard et al. IOSN guidance (Dental Update 2013),
   Table 4 (medical and behavioural) and Table 5 (treatment complexity). */
var IOSN_MEDICAL = [
  { value: 1, title: "No medical or behavioural indicators", detail: "" },
  { value: 2, title: "Minor systemic disorder or behavioural factor",
    detail: "Conditions not severe enough to exclude sedation but which treatment may exacerbate — fainting attacks, hypertension, angina, asthma, epilepsy. Typically ASA II." },
  { value: 3, title: "Moderate systemic disorder or reduced ability to co-operate",
    detail: "As above but more marked, or a condition compromising co-operation — arthritis, Parkinsonism, multiple sclerosis. Also a strong gag reflex. Typically ASA II." },
  { value: 4, title: "Severe systemic disorder, or unable to co-operate for simple treatment",
    detail: "Ability to co-operate is compromised even for simple procedures under local anaesthesia — for example severe learning disability. Typically ASA III." }
];

var IOSN_COMPLEXITY = [
  { value: 1, title: "Routine",
    detail: "Scaling · single-rooted extraction of one or two teeth · small soft tissue biopsy · single quadrant restorations · crown preparation · anterior endodontics." },
  { value: 2, title: "Intermediate",
    detail: "Scaling and root planing · multi-rooted extraction · surgical extraction without bone removal · anterior apicectomy · two quadrant restorative · posterior endodontics." },
  { value: 3, title: "Complex",
    detail: "Periodontal surgery · surgical extraction with bone removal · posterior apicectomy · multiple quadrant restorative · multiple posterior endodontics." },
  { value: 4, title: "Highly complex",
    detail: "Any treatment more complex than the above, or multiples of the above." }
];

/* Descriptor list where each rank carries a title and worked examples */
function rankList(key, ranks) {
  var cur = get(key);
  var html = '<div class="opts" role="radiogroup" data-roving="1" style="margin-top:12px;">';
  ranks.forEach(function (r, i) {
    var on = cur === r.value;
    var tabbable = (cur == null) ? (i === 0) : on;
    html += '<button type="button" class="opt rankopt" role="radio" aria-checked="' + on + '" aria-pressed="' + on + '"' +
      ' tabindex="' + (tabbable ? "0" : "-1") + '"' +
      ' data-act="num" data-key="' + esc(key) + '" data-val="' + r.value + '">' +
      '<span class="rankno">' + r.value + "</span>" +
      "<span><span class='ranktitle'>" + esc(r.title) + "</span>" +
      (r.detail ? "<span class='rankdetail'>" + esc(r.detail) + "</span>" : "") +
      "</span></button>";
  });
  return html + "</div>";
}

/* Grouped multi-select, used for the systems enquiry */
function checkGroups(key, groups) {
  var cur = get(key) || [];
  return groups.map(function (g) {
    var rows = g.items.map(function (it) {
      var on = cur.indexOf(it.id) >= 0;
      return '<button type="button" class="opt" aria-pressed="' + on + '"' +
        ' data-act="toggleGroup" data-key="' + esc(key) + '" data-val="' + esc(it.id) + '">' +
        '<span class="mark" style="color:' + (on ? "var(--accent)" : "var(--placeholder)") + '">' +
        (on ? I.checkOn : I.checkOff) + "</span><span>" + esc(it.label) + "</span></button>";
    }).join("");
    return '<div class="hgroup"><div class="eyebrow-soft">' + esc(g.title) + "</div>" +
           '<div class="opts" style="margin-top:8px;">' + rows + "</div></div>";
  }).join("");
}

/* Out-of-range entries are almost always typos (a systolic of 900), so flag
   them at the point of entry rather than letting them reach the record. */
var RANGES = {
  bpSys: [50, 300, "Systolic"], bpDia: [20, 200, "Diastolic"],
  pulse: [20, 250, "Pulse"], spo2: [50, 100, "Oxygen saturation"],
  wtKg: [1, 400, "Weight"], htCm: [40, 250, "Height"], alcohol: [0, 200, "Alcohol"]
};

function rangeWarnings() {
  var out = [];
  Object.keys(RANGES).forEach(function (k) {
    var v = parseFloat(get(k));
    if (isNaN(v)) return;
    var r = RANGES[k];
    if (v < r[0] || v > r[1]) out.push({ level: "note", text: r[2] + " of " + v + " is outside the expected range (" + r[0] + "–" + r[1] + "). Check for a typing error." });
  });
  return out;
}

/* ---------- Export ----------
   Two shapes: a full record for moving an assessment between devices, and a
   de-identified row for audit, which carries no patient identifiers at all. */

function download(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: mime || "text/plain;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    return true;
  } catch (e) { return false; }
}

function fileStem() {
  var who = (get("name") || "Patient").replace(/[\/\\:*?"<>|]/g, "").replace(/\s+/g, " ").trim() || "Patient";
  var when = get("date") || new Date().toISOString().slice(0, 10);
  return who + " - " + when;
}

function exportRecord() {
  download(fileStem() + ".json", JSON.stringify({
    format: "sedation-pre-assessment",
    version: VERSION,
    recordId: state.recordId,
    exportedAt: new Date().toISOString(),
    answers: withoutPrivateFields(state.a),
    medications: state.meds,
    note: "Patient-identifying fields and signatures are deliberately omitted. " +
          "This file carries the clinical content of an assessment in progress; " +
          "the signed record is the PDF."
  }, null, 2), "application/json");
}


function auditRow() {
  var b = computeBMI();
  var mt = mdasTotal();
  var it = iosnTotal();
  var p = iosnParts();
  return {
    record_id: state.recordId,
    assessment_date: get("date") || "",
    age: computeAge() == null ? "" : computeAge(),
    asa: get("asa") || "",
    bmi: b ? b.bmi.toFixed(1) : "",
    bmi_category: b ? bmiCategory(b.bmi).label : "",
    mallampati: get("mallampati") || "",
    osa: get("osa") || "",
    mdas_total: mt.complete ? mt.sum : "",
    mdas_severe: mt.complete ? (mt.sum >= 19 ? "yes" : "no") : "",
    iosn_anxiety: p.p1 == null ? "" : p.p1,
    iosn_medical: p.p2 == null ? "" : p.p2,
    iosn_complexity: p.p3 == null ? "" : p.p3,
    iosn_total: it == null ? "" : it,
    iosn_band: it == null ? "" : iosnBand(it).label,
    indications: (get("indications") || []).join("; "),
    history_count: (get("history") || []).length,
    technique: get("technique") || "",
    fit_for_sedation: get("fit") || "",
    flags_raised: clinicalFlags().length
  };
}

function csvCell(v) {
  var s = String(v == null ? "" : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportAudit() {
  var r = auditRow();
  var keys = Object.keys(r);
  var csv = keys.join(",") + "\n" + keys.map(function (k) { return csvCell(r[k]); }).join(",") + "\n";
  download("audit - " + (state.recordId || "record") + ".csv", csv, "text/csv;charset=utf-8");
}

function importRecord(file) {
  var reader = new FileReader();
  reader.onload = function () {
    try {
      var d = JSON.parse(reader.result);
      if (!d || d.format !== "sedation-pre-assessment" || typeof d.answers !== "object") {
        state.notice = "That file isn’t a sedation pre-assessment record.";
        render(false); return;
      }
      state.a = d.answers || {};
      state.meds = (d.medications && d.medications.length) ? d.medications
                 : [{ name: "", dose: "", freq: "", reason: "" }];
      state.sig = blankSignatures();   // never travels with an export
      state.recordId = d.recordId || newRecordId();
      state.step = 0;
      state.view = "form";
      state.notice = null;
      render(true);
    } catch (e) {
      state.notice = "That file could not be read.";
      render(false);
    }
  };
  reader.readAsText(file);
}

/* ---------- Allergy status ----------
   The most safety-critical field in the record, so it is surfaced on every
   screen and at the head of the printed summary rather than buried. */
function allergyState() {
  var st = get("allergyStatus");
  if (st === "Allergies recorded") {
    var txt = (get("allergies") || "").trim();
    return txt
      ? { tone: "alert", label: "Allergies", detail: txt.replace(/\s*\n+\s*/g, " · ") }
      : { tone: "warn", label: "Allergies recorded", detail: "details not yet entered" };
  }
  if (st === "No known drug allergies") return { tone: "ok", label: "No known drug allergies", detail: "" };
  return { tone: "warn", label: "Drug allergies not recorded", detail: "" };
}

function allergyBanner(opts) {
  var a = allergyState();
  /* Mid-flow, an unrecorded status just means the clinician hasn't reached that
     step yet, so warning about it is noise. Only the final steps chase it. */
  if (a.tone === "warn" && !(opts && opts.warn)) return "";
  return '<div class="allergy-bar" data-tone="' + a.tone + '" role="note">' +
    '<span class="ab-icon">' + (a.tone === "ok" ? I.checkOn : I.alert) + "</span>" +
    '<span><strong>' + esc(a.label) + "</strong>" +
    (a.detail ? '<span class="ab-detail"> — ' + esc(a.detail) + "</span>" : "") +
    "</span></div>";
}

/* ---------- New assessment ----------
   Carrying one patient's answers into the next is a wrong-patient risk, so the
   only route to a second assessment clears everything explicitly. */
function resetAll() {
  state.a = {};
  state.meds = [{ name: "", dose: "", freq: "", reason: "" }];
  state.sig = {
    patient:   { strokes: [], signedAt: null, snapshot: null, voidedAt: null },
    clinician: { strokes: [], signedAt: null, snapshot: null, voidedAt: null }
  };
  state.step = 0;
  state.furthest = 0;
  state.recordId = newRecordId();
  state.confirm = null;
  discardDraft();
  state.view = "intro";
}

function newRecordId() {
  var t = Date.now().toString(36).toUpperCase().slice(-6);
  var rnd = "";
  try {
    var buf = new Uint8Array(6);
    (self.crypto || window.crypto).getRandomValues(buf);
    for (var i = 0; i < buf.length; i++) rnd += (buf[i] % 36).toString(36);
  } catch (e) {
    for (var j = 0; j < 6; j++) rnd += Math.floor(Math.random() * 36).toString(36);
  }
  return "SPA-" + t + "-" + rnd.toUpperCase();
}

/* Inline confirmation for destructive actions, in place of a browser dialog */
function confirmView() {
  var c = state.confirm;
  if (!c) return "";
  return '<div class="overlay spa-noprint" role="dialog" aria-modal="true" aria-labelledby="cf-t">' +
    '<div class="dialog">' +
      '<h2 id="cf-t" style="font-family:var(--serif);font-size:20px;margin:0;color:var(--ink);">' + esc(c.title) + "</h2>" +
      '<p style="font-size:14.5px;line-height:1.6;color:var(--soft);margin:10px 0 0;">' + c.body + "</p>" +
      '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;">' +
        '<button type="button" class="btn-next" data-act="confirmYes">' + esc(c.confirmLabel) + "</button>" +
        '<button type="button" class="btn-quiet" data-act="confirmNo">Cancel</button>' +
      "</div>" +
    "</div></div>";
}

function subLabel(text) { return '<div class="flabel" style="margin-top:22px;">' + esc(text) + "</div>"; }

/* ---------- Signatures ---------- */

function fmtSigned(iso) {
  if (!iso) return "";
  var d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) +
         " at " + d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

/* Interactive pad, used on the declarations step */
function sigPad(role, name) {
  var s = state.sig[role];
  var signed = s.strokes.length > 0;
  var typedKey = role + "TypedName";
  var typedMode = get(role + "SignMode") === "typed";
  var typed = (get(typedKey) || "").trim();

  var pad = typedMode
    ? '<div class="typedwrap">' +
        '<label class="flabel" for="f_' + typedKey + '">Full name, typed as attestation</label>' +
        '<input id="f_' + typedKey + '" type="text" data-field="' + typedKey + '" ' +
          'placeholder="Type full name" autocomplete="off" />' +
        (typed ? '<div class="typedsig">' + esc(typed) + "</div>" : "") +
        '<div class="hint">Recorded as a typed attestation rather than a drawn signature, and labelled ' +
          "as such on the printed record.</div>" +
      "</div>"
    : '<canvas class="sigpad" data-sig="' + role + '" tabindex="0" role="img" ' +

/* Redraw stored strokes onto a canvas at its current size and pixel density */
function paintSig(canvas, strokes) {
  var rect = canvas.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  var dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(rect.width * dpr);
  canvas.height = Math.round(rect.height * dpr);
  var ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, rect.width, rect.height);
  ctx.strokeStyle = "#0F2F63";
  ctx.fillStyle = "#0F2F63";
  ctx.lineWidth = 1.8;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  strokes.forEach(function (stroke) {
    if (!stroke.length) return;
    if (stroke.length === 1) {
      ctx.beginPath();
      ctx.arc(stroke[0].x * rect.width, stroke[0].y * rect.height, 1.2, 0, Math.PI * 2);
      ctx.fill();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(stroke[0].x * rect.width, stroke[0].y * rect.height);
    for (var i = 1; i < stroke.length; i++) ctx.lineTo(stroke[i].x * rect.width, stroke[i].y * rect.height);
    ctx.stroke();
  });
  return ctx;
}

/* Attach drawing behaviour. Pointer events cover finger, stylus, and mouse. */
function bindSig(canvas, role) {
  var store = state.sig[role];
  var ctx = paintSig(canvas, store.strokes);
  if (!ctx) return;
  var drawing = false, current = null;

  function point(e) {
    var r = canvas.getBoundingClientRect();
    return {
      x: Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)),
      y: Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))
    };
  }

  canvas.addEventListener("pointerdown", function (e) {
    e.preventDefault();
    drawing = true;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    current = [point(e)];
    store.strokes.push(current);
  });

  canvas.addEventListener("pointermove", function (e) {
    if (!drawing || !current) return;
    e.preventDefault();
    var r = canvas.getBoundingClientRect();
    var prev = current[current.length - 1];
    var p = point(e);
    current.push(p);
    ctx.beginPath();
    ctx.moveTo(prev.x * r.width, prev.y * r.height);
    ctx.lineTo(p.x * r.width, p.y * r.height);
    ctx.stroke();
  });

  function finish() {
    if (!drawing) return;
    drawing = false;
    current = null;
    if (store.strokes.length && !store.signedAt) {
      store.signedAt = new Date().toISOString();
      store.voidedAt = null;
    }
    /* Re-stamp the snapshot so later strokes don't void the signature mid-flow */
    store.snapshot = recordFingerprint();
    saveDraft();
    /* Update the caption in place — re-rendering here would interrupt signing */
    var cap = root.querySelector('[data-sigtime="' + role + '"]');
    if (cap && store.signedAt) {
      cap.textContent = "Signed " + fmtSigned(store.signedAt);
      cap.setAttribute("data-signed", "true");
    }
  }
  canvas.addEventListener("pointerup", finish);
  canvas.addEventListener("pointercancel", finish);
  canvas.addEventListener("pointerleave", finish);
}
