      } else {
        result = '<div class="hintbox">Score all three parts to calculate the total indicator of sedation need.</div>';
      }

      return '<h2 class="step" tabindex="-1">Indicator of Sedation Need</h2>' +
        '<p class="lede">Each part is scored 1–4. The total determines the indicated level of sedation need.</p>' +
        part1 +
        '<h3 class="block">Part 2 · Medical &amp; behavioural indicators</h3>' +
        '<p class="lede">Rank the patient\u2019s medical and behavioural status. These indicators do not replace the full medical history recorded earlier.</p>' +
        rankList("iosn2", IOSN_MEDICAL) +
        '<h3 class="block">Part 3 · Treatment complexity</h3>' +
        '<p class="lede">Rank the planned treatment. The guidance is not exhaustive \u2014 if in doubt between two bands, score the higher.</p>' +
        rankList("iosn3", IOSN_COMPLEXITY) +
        result;
    }
  },
  {
    key: "justification", label: "Justification", tag: "Indication",
    render: function () {
      return '<h2 class="step" tabindex="-1">Justification for sedation</h2>' +
        '<p class="lede">The clinical reasoning supporting sedation for this patient.</p>' +
        subLabel("Primary indication") + checkList("indications", INDICATIONS) +
        subLabel("Previous sedation") + radioList("prevSedation", YESNO, { row: true, compact: true }) +
        (get("prevSedation") === "Yes" ? textField("prevOutcome", "If yes, outcome", { placeholder: "Agent, dose, and response" }) : "") +
        textArea("whySedation", "Alternatives considered, and why sedation is the best option",
          "Behavioural management, local anaesthesia alone, treatment staging — and the reasoning that supports sedation over them.");
    }
  },
  {
    key: "plan", label: "Summary & plan", tag: "Plan",
    render: function () {
      return '<h2 class="step" tabindex="-1">Clinical summary &amp; plan</h2>' +
        '<p class="lede">Treatment plan, technique, and fitness decision.</p>' +
        textArea("clinicalSummary", "Clinical summary", "Planned treatment, sedation considerations, escort and discharge arrangements…") +
        subLabel("Sedation technique") + radioList("technique", TECHNIQUE, { row: true, compact: true }) +
        subLabel("Fit for sedation") + radioList("fit", YESNO, { row: true, compact: true }) +
        (get("fit") === "No" ? textField("unfitReason", "Reason not fit for sedation", { placeholder: "Reason and onward plan" }) : "") +
        '<div class="grid2" style="margin-top:6px;">' +
          textField("clinician", "Clinician") +
          textField("signDate", "Date", { type: "date" }) +
        "</div>";
    }
  },
  {
    key: "escort", label: "Escort & discharge", tag: "Arrangements",
    render: function () {
      var iv = get("technique") && get("technique").indexOf("IV") === 0;
      var done = get("arrangements") || [];
      var outstanding = ARRANGEMENTS.filter(function (a) { return done.indexOf(a) < 0; });
      return '<h2 class="step" tabindex="-1">Escort, fasting &amp; discharge</h2>' +
        '<p class="lede">Tick each arrangement as it is confirmed. Anything left unticked is carried forward to the summary as outstanding.</p>' +
        (iv ? '<div class="hintbox">An intravenous technique is planned, so a responsible adult escort is required ' +
              "for the journey home and the rest of the day.</div>" : "") +
        checkList("arrangements", ARRANGEMENTS) +
        (outstanding.length
          ? '<div class="hint" style="margin-top:12px;">' + outstanding.length + " still outstanding.</div>"
          : '<div class="hint" style="margin-top:12px;">All arrangements confirmed.</div>') +
        '<h3 class="block">Escort details</h3>' +
        '<div class="grid2">' +
          textField("escortName", "Escort name and relationship", { placeholder: "e.g. Jane Smith, sister" }) +
          textField("escortPhone", "Contact number", { type: "tel" }) +
        "</div>" +
        textField("fastingInstruction", "Fasting instruction given", { placeholder: "e.g. no food 6 hours, clear fluids until 2 hours before" });
    }
  },
  {
    key: "sign", label: "Declarations", tag: "Signatures",
    render: function () {
      return '<h2 class="step" tabindex="-1">Declarations &amp; signatures</h2>' +
        '<p class="lede">Sign on screen with a finger, stylus, or mouse. Pads left blank print as ruled lines to sign by hand.</p>' +

        '<div class="sigblock">' +
          '<h3 class="block" style="margin-top:26px;">Patient</h3>' +
          '<p class="declaration">I confirm that the medical history, medication, and social history recorded in this ' +
            "assessment are accurate and complete to the best of my knowledge. I understand that I must tell the " +
            "clinical team about any change to my health or medication before my sedation appointment.</p>" +
          sigPad("patient", get("name")) +
        "</div>" +

        '<div class="sigblock">' +
          '<h3 class="block">Clinician</h3>' +
          '<p class="declaration">I confirm that I have assessed this patient, that the findings recorded above ' +
            "reflect that assessment, and that the sedation plan documented represents my clinical judgement.</p>" +
          sigPad("clinician", get("clinician")) +
        "</div>" +

        '<div class="hintbox"><strong>This is an assessment record, not a consent form.</strong> Consent to sedation ' +
          "and to the planned treatment should be recorded separately, in line with your own consent policy. " +
          "Review the declaration wording above against your practice&rsquo;s governance requirements before use.</div>";
    }
  }
];

/* ============================================================
   COMPLETENESS
   ============================================================ */

/* Look steps up by key so inserting a section can't silently break the checklist */
function stepIndex(key) {
  for (var i = 0; i < STEPS.length; i++) if (STEPS[i].key === key) return i;
  return 0;
}

var REQUIRED = [
  { key: "name",        label: "Patient name",         step: "patient" },
  { key: "ageYears",    label: "Age (from date of birth)", step: "patient" },
  { key: "assessedBy",  label: "Assessed by",          step: "patient" },
  { key: "asa",         label: "ASA classification",   step: "asa" },
  { key: "mallampati",  label: "Mallampati class",     step: "airway" },
  { key: "allergyStatus", label: "Drug allergy status", step: "meds" },
  { key: "gag",         label: "Gag reflex severity",  step: "gag" },
  { key: "anaesProblem",label: "Previous anaesthetic problems", step: "history" },
  
  { key: "technique",   label: "Sedation technique",   step: "plan" },
  { key: "fit",         label: "Fitness for sedation", step: "plan" }
];

function missingItems() {
  var out = REQUIRED.filter(function (r) {
    var v = get(r.key);
    return v == null || v === "";
  }).map(function (r) { return { label: r.label, step: stepIndex(r.step) }; });

  if (!computeBMI()) out.push({ label: "Height and weight", step: stepIndex("bmi") });
  if (!(get("history") || []).length) out.push({ label: "Medical history", step: stepIndex("history") });
  if (get("sex") === "Female" && !get("pregnancy"))
    out.push({ label: "Pregnancy status", step: stepIndex("history") });
  if (!get("capacity")) out.push({ label: "Capacity to consent", step: stepIndex("history") });
  if (!mdasTotal().complete) out.push({ label: "MDAS (all five items)", step: stepIndex("mdas") });
  if (iosnTotal() == null) out.push({ label: "IOSN (all three parts)", step: stepIndex("iosn") });
  if (!(get("indications") || []).length) out.push({ label: "Primary indication", step: stepIndex("justification") });
  if (!attested("patient")) out.push({ label: "Patient signature", step: stepIndex("sign") });
  if (!attested("clinician")) out.push({ label: "Clinician signature", step: stepIndex("sign") });
  return out;
}

/* ============================================================
   VIEWS
   ============================================================ */

function headerHTML(title) {
  return '<header class="app">' +
    '<div class="eyebrow-top">Sedation \u00B7 Adult pre-assessment</div>' +
    '<h1 class="app">' + esc(title) + "</h1>" +
    '<div class="byline spa-noprint">Developed by Aiden McCann \u00B7 v' + VERSION + "</div>" +
    "</header>";
}

function introView() {
  var draft = loadDraft();
  var resume = (draft && !state.keepDraft)
    ? '<div class="draftbar" style="border-color:var(--accent);">' +
        "<div><div style=\"font-size:14px;font-weight:600;\">Unfinished assessment found</div>" +
        '<div class="hint">Saved ' + fmtSigned(draft.savedAt) +
          ((draft.a && draft.a.ageYears) ? " · age " + esc(draft.a.ageYears) : "") +
          ". Identifying details and signatures are not retained, and will need re-entering.</div></div>" +
        '<div style="display:flex;gap:8px;">' +
          '<button type="button" class="btn-quiet" data-act="dropDraft">Discard</button>' +
          '<button type="button" class="btn-next" data-act="resumeDraft">Resume</button>' +
        "</div></div>"
    : "";

  return '<div class="shell"><div class="wrap-narrow">' +
    headerHTML("Sedation Pre-Assessment") +
    '<p style="font-size:16px;line-height:1.65;color:var(--soft);margin:0;">' +
      "This form records the pre-sedation assessment for <strong>adult patients aged 18 and over</strong>, in a " +
      "structured order: patient details, physical status, medical history, airway, medications, and social " +
      "history, followed by the MDAS and IOSN scores, the justification and treatment plan, escort and " +
      "discharge arrangements, and signed declarations. BMI, MDAS and IOSN totals are calculated as you " +
      "work, and the summary collects the findings that warrant attention before a sedation appointment " +
      "is confirmed." +
    "</p>" +
    resume +
    '<div class="draftbar">' +
      "<div>" +
        '<button type="button" class="switch" aria-pressed="' + state.keepDraft + '" data-act="toggleDraft">' +
          '<span class="box">' + (state.keepDraft ? I.checkOn : "") + "</span>" +
          "<span>Keep a working copy on this device</span></button>" +
        '<div class="hint">Off by default. A saved copy holds the clinical content only \u2014 no name, ' +
          "date of birth, address, phone, escort contact, or signatures. Use only on a device you control, " +
          "and clear the copy when finished.</div>" +
      "</div>" +
    "</div>" +
    '<div class="hintbox install-hint">Add this form to your home screen to use it offline at the chairside.</div>' +
    (state.notice ? '<div class="voidnote" style="margin-top:16px;">' + esc(state.notice) + "</div>" : "") +
    '<div style="display:flex;gap:12px;align-items:center;margin-top:28px;flex-wrap:wrap;">' +
      '<button type="button" class="btn-primary" data-act="begin">Begin assessment ' + I.arrowR + "</button>" +
      '<button type="button" class="btn-quiet" data-act="importRecord">Open a saved record</button>' +
      '<input type="file" id="importFile" accept="application/json,.json" style="display:none;" />' +
    "</div>" +
    '<p style="font-size:12.5px;color:var(--soft);line-height:1.6;margin-top:30px;">' +
      "For adults aged 18 and over. This is a record and decision-support form: it does not replace clinical " +
      "judgement, a full medical history, or the assessing clinician&rsquo;s responsibility for determining " +
      "fitness for sedation." +
    "</p>" +
    "</div></div>";
}

function railHTML() {
  return '<div class="rail spa-noprint">' + STEPS.map(function (s, i) {
    var st = i === state.step ? "current" : i < state.furthest || i < state.step ? "done" : "todo";
    return '<button type="button" class="rail-item" data-state="' + st + '" data-act="goto" data-idx="' + i + '">' +
      '<span class="rail-num">' + (i + 1) + "</span>" +
      '<span><span class="rail-label">' + esc(s.label) + "</span>" +
      '<span class="rail-tag" style="display:block;">' + esc(s.tag) + "</span></span></button>";
  }).join("") + "</div>";
}

function formView() {
  var step = STEPS[state.step];
  var last = state.step === STEPS.length - 1;
  return '<div class="shell"><div class="wrap">' +
    headerHTML("Sedation Pre-Assessment") +
    '<div class="cols">' + railHTML() +
      '<div class="body-col">' +
        allergyBanner({ warn: step.key === "sign" }) +
        '<span class="chip">' + esc(step.tag) + "</span>" +
        step.render() +
        '<div class="nav spa-noprint">' +
          '<button type="button" class="btn-back" data-act="back"' + (state.step === 0 ? " disabled" : "") + ">" + I.arrowL + " Back</button>" +
          '<button type="button" class="btn-next" data-act="next">' + (last ? "View summary" : "Continue") + " " + I.arrowR + "</button>" +
        "</div>" +
      "</div></div></div></div>";
}

function row(k, v) {
  var empty = v == null || v === "" || (Array.isArray(v) && !v.length);
  var val = Array.isArray(v) ? v.join(", ") : v;
  return '<div class="srow"><span class="skey">' + esc(k) + "</span>" +
    '<span class="sval' + (empty ? " empty" : "") + '">' + esc(empty ? "Not recorded" : val) + "</span></div>";
}

/* The outcome of the assessment, surfaced at the top. Without this the
   fitness decision and planned technique sit on the last page, in the same
   weight as every other field. */
function outcomeBand() {
  var fit = get("fit");
  var tech = get("technique");
  var it = iosnTotal();
  var tone = fit === "No" ? "stop" : fit === "Yes" ? "go" : "pending";
  var verdict = fit === "Yes" ? "Fit for sedation"
              : fit === "No"  ? "Not fit for sedation"
              : "Fitness for sedation not recorded";
  var bits = [];
  if (tech) bits.push(tech);
  if (it != null) bits.push("IOSN " + it + "/12 \u00B7 " + iosnBand(it).label.toLowerCase() + " need");
  if (fit === "No" && get("unfitReason")) bits.push(get("unfitReason"));
  return '<div class="outcome" data-tone="' + tone + '">' +
    '<span class="outcome-verdict">' + esc(verdict) + "</span>" +
    (bits.length ? '<span class="outcome-detail">' + esc(bits.join(" \u00B7 ")) + "</span>" : "") +
    "</div>";
}

function summaryView() {
  var b = computeBMI();
  var mt = mdasTotal();
  var it = iosnTotal();
  var band = it != null ? iosnBand(it) : null;
  var flags = clinicalFlags().concat(rangeWarnings());
  var missing = missingItems();

  var meds = state.meds.filter(function (m) { return m.name || m.dose || m.freq || m.reason; });
  var medHTML = meds.length
    ? meds.map(function (m) {
        return row(m.name || "Unnamed", [m.dose, m.freq, m.reason].filter(Boolean).join(" \u00B7 ") || "—");
      }).join("")
    : row("Medications", "");

  var headline = "";
  if (it != null) {
    headline = '<div class="resultcard" aria-live="polite" style="border-color:' + band.color + ';">' +
      '<span class="eyebrow-soft">Indicator of sedation need</span>' +
      '<div style="display:flex;align-items:baseline;gap:12px;margin-top:8px;flex-wrap:wrap;">' +
        '<span class="bignum">' + it + '</span><span class="bigunit">/ 12</span>' +
        '<span class="chip" style="margin-left:auto;">' + esc(band.label) + " need</span>" +
      "</div>" +
      '<p class="lede">' + (mt.complete ? "MDAS " + mt.sum + "/25" + (mt.sum >= 19 ? " (severe dental phobia)" : "") + " \u00B7 " : "") +
        (b ? "BMI " + b.bmi.toFixed(1) + " (" + bmiCategory(b.bmi).label + ") \u00B7 " : "") +
        (get("asa") ? "ASA " + get("asa") : "ASA not recorded") + "</p></div>";
  }

  var GROUPS = [
    { key: "stop",   title: "Address before proceeding",
      note: "These would ordinarily stop the appointment or change it materially." },
    { key: "review", title: "Requires a decision or plan",
      note: "Each needs an active management decision before the appointment." },
    { key: "note",   title: "For awareness", note: "" }
  ];

  var flagsHTML;
  if (!flags.length) {
    flagsHTML = '<div class="panel"><span class="eyebrow-soft">Points for consideration</span>' +
      '<p class="lede">No advisory flags raised from the responses recorded.</p></div>';
  } else {
    var topTone = flags.some(function (x) { return x.level === "stop"; }) ? "var(--clay)" : "var(--amber)";
    var groupsHTML = GROUPS.map(function (g) {
      var items = flags.filter(function (x) { return x.level === g.key; });
      if (!items.length) return "";
      return '<div class="flaggroup" data-level="' + g.key + '">' +
        '<div class="flaghead"><span class="flagcount">' + items.length + "</span>" +
        "<span>" + esc(g.title) + "</span></div>" +
        (g.note ? '<div class="flagnote">' + esc(g.note) + "</div>" : "") +
        '<div class="flaglist">' + items.map(function (x) {
          return '<div class="flag"><span class="flagdot"></span><span>' + esc(x.text) + "</span></div>";
        }).join("") + "</div></div>";
    }).join("");

    flagsHTML = '<div class="resultcard" aria-live="polite" style="border-color:' + topTone + ';">' +
      '<div style="display:flex;gap:9px;align-items:center;"><span style="color:' + topTone + ';">' + I.alert + "</span>" +
      '<span class="eyebrow-soft" style="color:' + topTone + ';">Points for consideration \u00B7 ' + flags.length + "</span></div>" +
      groupsHTML +
      '<p class="lede" style="margin-top:12px;">These are prompts for clinical consideration, not determinations. ' +
      "The decision on fitness for sedation rests with the assessing clinician.</p></div>";
  }

  var missingHTML = missing.length
    ? '<div class="alertbox spa-noprint"><span style="color:var(--amber);flex-shrink:0;">' + I.alert + "</span><div>" +
        "<strong>Incomplete:</strong> " + missing.map(function (m) { return esc(m.label); }).join(", ") +
        ". Use the step numbers above to complete these before signing.</div></div>"
    : "";

  var voided = anyVoided();

  /* Repeats on every printed page in Chrome-based browsers, so a sheet that
     becomes separated from the rest can still be identified. */
  var printHead =
    '<div class="print-head" aria-hidden="true">' +
      "<span><strong>" + esc(get("name") || "Patient record") + "</strong>" +
      (computeAge() != null ? " · age " + computeAge() : "") + "</span>" +
      "<span>Sedation pre-assessment · " + esc(state.recordId || "") + "</span>" +
    "</div>";

  var printFoot =
    '<div class="print-foot">Generated ' + fmtSigned(new Date().toISOString()) +
    " · Sedation Pre-Assessment v" + VERSION + " · " + esc(state.recordId || "") + "</div>";

  var voidHTML = voided.length
    ? '<div class="voidnote" style="margin-top:22px;">' +
        (voided.length === 2 ? "Both signatures were" : "The " + voided[0] + " signature was") +
        " voided because the record was amended after signing. The record must be signed again before it is filed." +
      "</div>"
    : "";

  return '<div class="shell"><div class="wrap-narrow">' +
    printHead +
    headerHTML("Sedation Pre-Assessment") +
    '<span class="eyebrow">Assessment summary</span>' +
    '<h2 class="summary">' + esc(get("name") || "Patient record") + "</h2>" +
    '<div class="byline">' + esc(get("date") || "Date not recorded") + " \u00B7 Assessed by " +
      esc(get("assessedBy") || "not recorded") + " \u00B7 " + esc(state.recordId || "") + "</div>" +
    outcomeBand() +
    allergyBanner({ warn: true }) +
    voidHTML + headline + flagsHTML + missingHTML +

    '<h3 class="block">Patient</h3><div class="panel">' +
      row("Name", get("name")) +
      row("Age at assessment", computeAge() != null ? computeAge() + " years" : "") +
      row("Sex", get("sex")) + row("Phone", get("phone")) +
      row("Address", get("address")) +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Physical status</h3><div class="panel">' +
      row("ASA classification", get("asa") ? "ASA " + get("asa") : "") +
      row("BMI", b ? b.bmi.toFixed(1) + " kg/m² · " + bmiCategory(b.bmi).label : "") +
      row("Blood pressure", (get("bpSys") && get("bpDia")) ? get("bpSys") + "/" + get("bpDia") + " mmHg" : "") +
      row("Pulse", get("pulse") ? get("pulse") + " bpm" : "") +
      row("Oxygen saturation", get("spo2") ? get("spo2") + "%" : "") +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Medical history</h3><div class="panel">' +
      row("Conditions", (get("history") || []).map(function (id) {
        var it = historyItem(id); return it ? it.label : id;
      })) +
      row("Diabetes", [get("diabetesType"), get("diabetesControl")].filter(Boolean).join(" · ")) +
      row("Anticoagulation", [get("anticoagName"), get("anticoagINR")].filter(Boolean).join(" · ")) +
      row("Details", get("historyDetail")) +
      row("Previous anaesthetic problems", get("anaesProblem")) +
      row("Details", get("anaesProblemDetail")) +
      row("Family history of anaesthetic problems", get("anaesFamily")) +
      row("Details", get("anaesFamilyDetail")) +
      row("Pregnant / possibly pregnant", [get("pregnancy"), get("trimester")].filter(Boolean).join(" · ")) +
      row("Breastfeeding", get("breastfeeding")) +
      row("Capacity to consent", get("capacity")) +
      row("Best-interests decision", get("bestInterests")) +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Airway</h3><div class="panel">' +
      row("Mallampati class", get("mallampati")) + row("Mouth opening", get("mouthOpening")) +
      row("Neck mobility", get("neck")) +
      row("Facial / jaw abnormality", get("facialAbn")) +
      row("Beard / facial hair", get("beard")) +
      row("Dentition", get("dentition")) +
      row("Sleep apnoea / snoring", get("osa")) +
      row("Airway notes", get("airwayNotes")) +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Medications &amp; allergies</h3><div class="panel">' + medHTML +
      row("Allergy status", get("allergyStatus")) +
      row("Allergy details", get("allergies")) +
      row("CNS depressant", get("cnsDepressant") === "Yes"
        ? ("Yes" + (get("cnsDepressantDetail") ? " · " + get("cnsDepressantDetail") : ""))
        : get("cnsDepressant")) + "</div>" +

    '<h3 class="block">Gag reflex &amp; social history</h3><div class="panel">' +
      row("Gag reflex severity", get("gag")) + row("Triggered by", get("gagTrigger")) +
      row("Recreational drugs", get("drugs")) + row("Frequency", get("drugFreq")) + row("Last used", get("drugLast")) +
      row("Alcohol (units/week)", get("alcohol")) + row("Smoking", get("smoking")) +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Anxiety &amp; sedation need</h3><div class="panel">' +
      row("MDAS total", mt.complete ? mt.sum + " / 25" + (mt.sum >= 19 ? " · severe dental phobia" : "") : "") +
      row("IOSN Part 1 · Anxiety", iosnParts().p1) +
      row("IOSN Part 2 · Medical factors", iosnParts().p2) +
      row("IOSN Part 3 · Treatment complexity", iosnParts().p3) +
      row("IOSN total", it != null ? it + " / 12 · " + band.label + " need" : "") +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Justification</h3><div class="panel">' +
      row("Primary indication", get("indications")) + row("Previous sedation", get("prevSedation")) +
      row("Outcome", get("prevOutcome")) +
      row("Alternatives considered, and why sedation", get("whySedation")) +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Plan</h3><div class="panel">' +
      row("Clinical summary", get("clinicalSummary")) + row("Sedation technique", get("technique")) +
      row("Fit for sedation", get("fit")) + row("Reason", get("unfitReason")) +
      row("Clinician", get("clinician")) + row("Date", get("signDate")) +
    "</div></section>" +

    '<section class="sec"><h3 class="block">Escort, fasting &amp; discharge</h3><div class="panel">' +
      row("Escort", get("escortName")) +
      row("Escort contact", get("escortPhone")) +
      row("Confirmed", get("arrangements")) +
      row("Outstanding", ARRANGEMENTS.filter(function (a) {
        return (get("arrangements") || []).indexOf(a) < 0;
      })) +
      row("Fasting instruction", get("fastingInstruction")) +
    "</div></section>" +

    '<h3 class="block">Declarations</h3>' +
    '<div class="panel" style="padding:18px;">' +
      '<p style="font-size:13px;line-height:1.55;color:var(--soft);margin:0 0 4px;">' +
        "The patient confirms the history recorded here is accurate and complete to the best of their knowledge. " +
        "The clinician confirms the assessment and sedation plan reflect their clinical judgement." +
      "</p>" +
      sigView("patient", get("name"), "Patient signature") +
      sigView("clinician", get("clinician") || get("assessedBy"), "Clinician signature") +
    "</div>" +

    '<div class="nav spa-noprint" style="gap:12px;flex-wrap:wrap;justify-content:flex-start;">' +
      '<button type="button" class="btn-primary" data-act="print">' + I.printer + " Save as PDF</button>" +
      '<button type="button" class="btn-outline" data-act="edit">' + I.edit + " Edit responses</button>" +
      '<button type="button" class="btn-outline" data-act="newAssessment">' + I.plus + " New assessment</button>" +
    "</div>" +
    '<div class="nav spa-noprint" style="gap:10px;flex-wrap:wrap;justify-content:flex-start;margin-top:12px;">' +
      '<button type="button" class="btn-quiet" data-act="exportAudit">Export audit row (CSV)</button>' +
      '<button type="button" class="btn-quiet" data-act="exportRecord">Export record (JSON)</button>' +
      (state.keepDraft
        ? '<button type="button" class="btn-quiet" data-act="clearDraft">Clear saved copy</button>'
        : "") +
    "</div>" +
    '<div class="hintbox spa-noprint">Choose <strong>Save as PDF</strong> as the destination in the print dialogue to file ' +
      "this in the patient&rsquo;s records. The file is named automatically from the patient name and assessment date.</div>" +
    '<p style="font-size:12.5px;color:var(--soft);line-height:1.6;margin-top:26px;">' +
      "Decision-support only. Fitness for sedation is determined by the assessing clinician on the basis of the full " +
      "history, examination, and the standards applicable in the treating setting." +
    "</p>" + printFoot +
    "</div></div>";
}

/* ============================================================
   MOUNT & EVENTS
   ============================================================ */

var root = document.getElementById("root");

function hydrate() {
  /* Restore text values without re-rendering on keystroke (keeps focus/caret) */
  root.querySelectorAll("[data-field]").forEach(function (el) {
    var v = get(el.getAttribute("data-field"));
    el.value = (v == null) ? "" : v;
  });
  root.querySelectorAll("[data-med]").forEach(function (el) {
    var m = state.meds[parseInt(el.getAttribute("data-med"), 10)];
    if (m) el.value = m[el.getAttribute("data-col")] || "";
  });
  /* Canvases lose their contents on re-render, so repaint from stored strokes.
     Deferred a frame so layout is settled and the pad has a measurable size. */
  requestAnimationFrame(function () {
    root.querySelectorAll("[data-sig]").forEach(function (c) {
      bindSig(c, c.getAttribute("data-sig"));
    });
    root.querySelectorAll("[data-sigview]").forEach(function (c) {
      paintSig(c, state.sig[c.getAttribute("data-sigview")].strokes);
    });
  });
}

/* Name the PDF from the record so it files correctly in patient notes */
function saveAsPDF() {
  var original = document.title;
  /* Strip only characters filesystems reject — accented names must survive intact */
  var who = (get("name") || "").replace(/[\/\\:*?"<>|]/g, "").replace(/\s+/g, " ").trim() || "Patient";
  var when = get("date") || get("signDate") || new Date().toISOString().slice(0, 10);
  document.title = "Sedation Pre-Assessment - " + who + " - " + when;
  function restore() {
    document.title = original;
    window.removeEventListener("afterprint", restore);
  }
  window.addEventListener("afterprint", restore);
  setTimeout(restore, 60000);
  window.print();
}

/* A re-render replaces the DOM, which would drop keyboard focus on every
   selection. Capture what was focused and restore it afterwards. */
function focusKey(el) {
  if (!el || !el.getAttribute || el === document.body) return null;
  if (el.hasAttribute("data-field")) return "f|" + el.getAttribute("data-field");
  if (el.hasAttribute("data-med")) return "m|" + el.getAttribute("data-med") + "|" + el.getAttribute("data-col");
  if (el.hasAttribute("data-key") && el.hasAttribute("data-val"))
    return "r|" + el.getAttribute("data-key") + "|" + el.getAttribute("data-val");
  if (el.hasAttribute("data-act")) return "a|" + el.getAttribute("data-act");
  return null;
}

function restoreFocus(key) {
  if (!key) return;
  var p = key.split("|"), el = null;
  try {
    if (p[0] === "f") el = root.querySelector('[data-field="' + p[1] + '"]');
    else if (p[0] === "m") el = root.querySelector('[data-med="' + p[1] + '"][data-col="' + p[2] + '"]');
    else if (p[0] === "r") el = root.querySelector('[data-key="' + p[1] + '"][data-val="' + p[2] + '"]');
    else if (p[0] === "a") el = root.querySelector('[data-act="' + p[1] + '"]');
  } catch (e) { return; }
  if (el && el.focus) {
    el.focus({ preventScroll: true });
    if (el.getAttribute("role") === "radio") el.setAttribute("tabindex", "0");
  }
}

function render(scroll) {
  var keep = scroll ? null : focusKey(document.activeElement);
  root.innerHTML = (state.view === "intro" ? introView()
                 : state.view === "summary" ? summaryView()
                 : formView()) + confirmView();
  hydrate();
  if (scroll) {
    window.scrollTo({ top: 0, behavior: "smooth" });
    /* Announce the new section to screen readers by moving focus to its heading */
    var h = root.querySelector("h2[tabindex='-1']");
    if (h) h.focus({ preventScroll: true });
  } else {
    restoreFocus(keep);
  }
  var dlg = root.querySelector(".dialog button");
  if (dlg) dlg.focus();
}

/* Text entry updates state silently — no re-render, so focus is never lost.
   Fields whose value feeds a live calculation re-render on blur/change. */
var LIVE = ["wtKg", "htCm", "wtSt", "wtLb", "htFt", "htIn", "alcohol"];

root.addEventListener("input", function (e) {
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute("data-field")) {
    set(t.getAttribute("data-field"), t.value);
  } else if (t.hasAttribute && t.hasAttribute("data-med")) {
    var i = parseInt(t.getAttribute("data-med"), 10);
    if (state.meds[i]) { state.meds[i][t.getAttribute("data-col")] = t.value; touchRecord(); }
  }
});

root.addEventListener("change", function (e) {
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute("data-field") && LIVE.indexOf(t.getAttribute("data-field")) >= 0) render(false);
});

/* Arrow-key navigation within option groups (WAI-ARIA radio group pattern) */
root.addEventListener("keydown", function (e) {
  var keys = ["ArrowRight", "ArrowDown", "ArrowLeft", "ArrowUp", "Home", "End"];
  if (keys.indexOf(e.key) < 0) return;
  var btn = e.target.closest ? e.target.closest('[role="radio"]') : null;
  if (!btn) return;
  var group = btn.closest('[data-roving="1"]');
  if (!group) return;

  var items = Array.prototype.slice.call(group.querySelectorAll('[role="radio"]'));
  var i = items.indexOf(btn);
  var next;
  if (e.key === "Home") next = 0;
  else if (e.key === "End") next = items.length - 1;
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") next = (i + 1) % items.length;
  else next = (i - 1 + items.length) % items.length;

  e.preventDefault();
  items.forEach(function (el, n) { el.setAttribute("tabindex", n === next ? "0" : "-1"); });
  items[next].focus();
  /* Selecting on arrow matches native radio behaviour, but must not toggle off:
     landing on an already-selected option should leave it selected. */
  if (items[next].getAttribute("aria-checked") !== "true") items[next].click();
});

root.addEventListener("click", function (e) {
  var el = e.target.closest("[data-act]");
  if (!el) return;
  var act = el.getAttribute("data-act");

  if (act === "begin") {
    if (!get("date")) state.a.date = new Date().toISOString().slice(0, 10);
    state.view = "form"; render(true); return;
  }

  if (act === "toggleDraft") {
    state.keepDraft = !state.keepDraft;
    if (state.keepDraft) saveDraft(); else discardDraft();
    render(false); return;
  }
  if (act === "resumeDraft") {
    var d = loadDraft();
    if (d) { restoreDraft(d); state.view = "form"; }
    render(true); return;
  }
  if (act === "dropDraft") { discardDraft(); render(false); return; }
  if (act === "clearDraft") {
    discardDraft(); state.keepDraft = false;
    render(false); return;
  }

  if (act === "radio") {
    var k = el.getAttribute("data-key"), v = el.getAttribute("data-val");
    set(k, get(k) === v ? undefined : v);
    render(false); return;
  }

  if (act === "num") {
    var nk = el.getAttribute("data-key"), nv = parseInt(el.getAttribute("data-val"), 10);
    set(nk, get(nk) === nv ? undefined : nv);
    render(false); return;
  }

  if (act === "toggle") {
    var tk = el.getAttribute("data-key"), tv = el.getAttribute("data-val");
    var arr = (get(tk) || []).slice();
    var at = arr.indexOf(tv);
    if (at >= 0) arr.splice(at, 1); else arr.push(tv);
    /* "None" is exclusive of the other substances */
    /* Options that assert "nothing here" cannot coexist with a positive finding */
    var EXCLUSIVE = ["None", "Nothing of note"];
    if (EXCLUSIVE.indexOf(tv) >= 0 && at < 0) arr = [tv];
    else if (EXCLUSIVE.indexOf(tv) < 0) arr = arr.filter(function (x) { return EXCLUSIVE.indexOf(x) < 0; });
    set(tk, arr);
    render(false); return;
  }

  if (act === "clearOverride") { set("iosn1Override", undefined); render(false); return; }
  if (act === "addMed") { state.meds.push({ name: "", dose: "", freq: "", reason: "" }); touchRecord(); render(false); return; }
  if (act === "rmMed") {
    var idx = parseInt(el.getAttribute("data-idx"), 10);
    state.meds.splice(idx, 1);
    if (!state.meds.length) state.meds.push({ name: "", dose: "", freq: "", reason: "" });
    touchRecord();
    render(false); return;
  }

  if (act === "goto") { state.step = parseInt(el.getAttribute("data-idx"), 10); saveDraft(); render(true); return; }
  if (act === "back") {
    if (state.step > 0) { state.step--; render(true); }
    else { state.view = "intro"; render(true); }
    return;
  }
  if (act === "next") {
    if (state.step < STEPS.length - 1) { state.step++; state.furthest = Math.max(state.furthest, state.step); }
    else state.view = "summary";
    render(true); return;
  }
  if (act === "toggleGroup") {
    var gk = el.getAttribute("data-key"), gv = el.getAttribute("data-val");
    var garr = (get(gk) || []).slice();
    var gat = garr.indexOf(gv);
    if (gat >= 0) garr.splice(gat, 1); else garr.push(gv);
    /* "No significant medical history" cannot coexist with a condition */
    var item = historyItem(gv);
    if (item && item.exclusive && gat < 0) garr = [gv];
    else if (gat < 0) garr = garr.filter(function (x) {
      var i2 = historyItem(x); return !(i2 && i2.exclusive);
    });
    set(gk, garr);
    render(false); return;
  }

  if (act === "newAssessment") {
    state.confirm = {
      title: "Start a new assessment?",
      body: "This clears the current record completely, including both signatures. " +
            "Save the PDF first if it hasn’t been filed yet — it cannot be recovered afterwards.",
      confirmLabel: "Clear and start new",
      run: resetAll
    };
    render(false); return;
  }
  if (act === "confirmYes") {
    var run = state.confirm && state.confirm.run;
    state.confirm = null;
    if (run) run();
    render(true); return;
  }
  if (act === "confirmNo") { state.confirm = null; render(false); return; }

  if (act === "signMode") {
    var smRole = el.getAttribute("data-role");
    var key = smRole + "SignMode";
    state.a[key] = (get(key) === "typed") ? "draw" : "typed";
    render(false); return;
  }

  if (act === "exportRecord") { exportRecord(); return; }
  if (act === "exportAudit") { exportAudit(); return; }
  if (act === "importRecord") {
    var inp = root.querySelector("#importFile");
    if (inp) inp.click();
    return;
  }

  if (act === "clearSig") {
    var role = el.getAttribute("data-role");
    state.sig[role] = { strokes: [], signedAt: null, snapshot: null, voidedAt: null };
    state.a[role + "TypedName"] = "";
    render(false); return;
  }
  if (act === "edit") { state.view = "form"; state.step = 0; render(true); return; }
  if (act === "print") { saveAsPDF(); return; }
});

if (!state.recordId) state.recordId = newRecordId();

/* File picker for importing a saved record */
root.addEventListener("change", function (e) {
  if (e.target && e.target.id === "importFile" && e.target.files && e.target.files[0]) {
    importRecord(e.target.files[0]);
  }
});

render(false);
</script>
</body>
</html>
