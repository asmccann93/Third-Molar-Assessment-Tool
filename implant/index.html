<style>
  :root{
    --navy:#0F2F63; --ink:#0F2F63; --accent:#1E4D9B; --soft:#3F5A8A; --muted:#4A6FA5;

  .ostb a:hover{color:var(--navy);background:#EDF3FC;}
  .ostb a[aria-current="page"]{color:var(--navy);background:var(--tint);border-color:var(--chip-line);}
  .ostb a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  @media print{.ostb{display:none !important;}}
  @media (max-width:480px){.ostb{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}.ostb::-webkit-scrollbar{display:none;}.ostb-label{display:none;}.ostb a{white-space:nowrap;}}

  .shell{max-width:700px;margin:0 auto;padding:30px 20px 72px;}

  h1.app{font-family:var(--serif);font-size:28px;margin:6px 0 0;color:var(--ink);line-height:1.2;}
  .byline{font-size:13px;color:var(--soft);margin-top:5px;}

<script>
  // The service worker keeps these tools usable without a connection, but nothing
  // on screen said so - a clinician could not tell a live page from a cached one.
  // navigator.onLine reports whether the device has a network interface, not
  // whether the server is reachable, so this is deliberately worded as "offline"
  // rather than claiming the content is stale.
  (function () {
    var el = null;
    function ensure() {
      if (el || !document.body) return el;
      el = document.createElement("div");
      el.className = "osoff";
      el.setAttribute("role", "status");
      el.setAttribute("aria-live", "polite");
      el.textContent = "Offline \u2014 you are seeing the saved copy of this page. It stays fully usable.";
      document.body.appendChild(el);
      return el;
    }
    function update() {
      var n = ensure();
      if (n) n.style.display = navigator.onLine ? "none" : "block";
    }
    window.addEventListener("online", update);
    window.addEventListener("offline", update);
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", update);
    } else {
      update();
    }
  })();
</script>

  /* Interaction polish. Self-contained like the offline notice above, so it

     This block sits after each page's own stylesheet, so where it repeats a

     names background-color and border-color as well as transform, so it adds
     the press feedback without discarding hover behaviour the pages already had. */

<script>
/* ============================================================
   Implant Case Assessment — oralsurgeryassess.com/implant/
   Developed by Aiden McCann.

   PREVIEW. Not linked from the site, not indexed, and every clinical
   figure in it is a DRAFT awaiting the clinical lead's review. Nothing
   here is to be used for a real patient until that review is done and
   this banner is gone.

   A structured assessment for a single-tooth implant: the site, the
   patient, the measurements the clinician took from their own CBCT,
   and — optionally — a check of a proposed implant against clearance
   margins. It ends in a plan summary to copy into the notes.

   It does not read images. The measurements are the clinician's.
   Deliberately holds no patient identifiers, writes nothing to
   storage, and sends nothing anywhere.
   ============================================================ */
var VERSION = "0.1.0-preview";

/* ---------- Sites. Single teeth, FDI, third molars excluded. ---------- */
var SITES = [17,16,15,14,13,12,11,21,22,23,24,25,26,27,47,46,45,44,43,42,41,31,32,33,34,35,36,37];

function siteInfo(t) {
  t = +t;
  var q = Math.floor(t / 10), n = t % 10, upper = q === 1 || q === 2;
  var posterior = n >= 4;
  var info = { tooth: t, upper: upper, posterior: posterior };
  // DRAFT: aesthetic zone = upper 14 to 24.
  info.aesthetic = upper && n <= 4;
  // What limits available height at this site, and whether it is a structure
  // that must not be reached (a nerve) or one that can be augmented (a floor).
  // `bone` is how the bone between the crest and that structure is described.
  if (upper && posterior) info.limit = { key: "sinus", label: "the sinus floor", bone: "the bone below the sinus floor", vital: false };
  else if (upper) info.limit = { key: "nasal", label: "the nasal floor", bone: "the bone below the nasal floor", vital: false };
  else if (posterior) info.limit = { key: "canal", label: n <= 5 ? "the mental foramen or canal" : "the inferior alveolar canal", vital: true };
  else info.limit = { key: "border", label: "the inferior border", bone: "the bone above the inferior border", vital: false };
  return info;
}

/* ---------- DRAFT clinical figures. Every number the tool uses is here, in
   one place, so the review is one list and a change is one line. ---------- */
var DRAFT = {
  toothClearance: 1.5,       // implant surface to adjacent root, each side, mm
  wallClearance: 1.5,        // bone remaining buccal and lingual, each side, mm (implant assumed centred)
  vitalClearance: 2.0,       // apex to a nerve, mm
  restorativeMin: 7.0,       // crest to opposing tooth for a single crown, mm
  bands: [                   // complexity score -> rating
    { max: 3, label: "Straightforward" },
    { max: 7, label: "Advanced" },
    { max: Infinity, label: "Complex" }
  ]
};

/* ---------- Questions.
   `pts` is what an answer adds to the complexity score. `adv` is an advisory
   in risk-then-action form. `hard` marks a finding that takes the case out of
   routine primary-care placement regardless of score. `when` limits a
   question to the sites it applies to. ---------- */
var SECTIONS = [
  { id: "site", title: "The site", chip: "Site",
    helper: "One missing tooth, or one about to be removed. Spans and full arches are outside this version.",
    qs: [
      { id: "tooth", label: "Which tooth is being replaced?", type: "tooth" },
      { id: "timing", label: "Where is the site in its healing?", opts: [
          { v: "present", t: "Tooth still present — immediate placement being considered", pts: 2,
            adv: { risk: "Immediate placement depends on an intact socket and primary stability, and is less forgiving of a thin buccal wall.",
                   action: "Confirm the buccal plate on the CBCT and have a delayed placement plan ready if stability is not reached." } },
          { v: "early", t: "Recently extracted — soft tissue healed, bone still remodelling", pts: 1 },
          { v: "healed", t: "Healed ridge" } ] },
      { id: "smile", label: "Smile line", when: function (s) { return s.aesthetic; }, opts: [
          { v: "low", t: "Low — gingival margin not shown" },
          { v: "avg", t: "Average" },
          { v: "high", t: "High — gingiva shown when smiling", pts: 1,
            adv: { risk: "A high smile line shows any recession, grey show-through or papilla loss around the implant crown.",
                   action: "Discuss the aesthetic risk explicitly and record it; consider whether soft-tissue augmentation will be needed." } } ] },
      { id: "phenotype", label: "Soft-tissue phenotype at the site", opts: [
          { v: "thick", t: "Thick" },
          { v: "thin", t: "Thin", pts: 1,
            adv: { risk: "Thin tissue is more prone to recession and to showing the implant through the mucosa.",
                   action: "Plan for this in the aesthetic zone, and include recession in the consent discussion." } },
          { v: "na", t: "Not assessed", unknown: true } ] },
      { id: "km", label: "Band of keratinised mucosa at the site", opts: [
          { v: "adequate", t: "2 mm or more" },
          { v: "narrow", t: "Less than 2 mm", pts: 1,
            adv: { risk: "A narrow band of keratinised mucosa makes cleaning around the implant harder and is associated with more soft-tissue problems.",
                   action: "Consider whether soft-tissue grafting is needed, and emphasise maintenance." } },
          { v: "none", t: "None", pts: 1,
            adv: { risk: "No keratinised mucosa makes cleaning around the implant harder and is associated with more soft-tissue problems.",
                   action: "Consider whether soft-tissue grafting is needed, and emphasise maintenance." } } ] }
    ] },

  { id: "pt", title: "Patient factors", chip: "Patient",
    helper: "Each factor is recorded as found. An advisory appears where it changes the plan.",
    qs: [
      { id: "growth", label: "Is jaw growth complete?", opts: [
          { v: "yes", t: "Yes" },
          { v: "no", t: "No, or uncertain", hard: true,
            adv: { risk: "An implant does not move with continuing growth, and ends up out of line with the teeth around it.",
                   action: "Defer implant placement until growth is complete; consider an interim replacement." } } ] },
      { id: "smoking", label: "Smoking", opts: [
          { v: "no", t: "Non-smoker, or stopped" },
          { v: "light", t: "Smokes, fewer than 10 a day", pts: 1,
            adv: { risk: "Smoking raises the risk of the implant failing and of bone loss around it.",
                   action: "Advise stopping, record that the advice was given, and include the raised risk in the consent discussion." } },
          { v: "heavy", t: "Smokes 10 or more a day", pts: 2,
            adv: { risk: "Heavy smoking substantially raises the risk of the implant failing and of bone loss around it.",
                   action: "Advise stopping and consider deferring until the patient has; include the raised risk in the consent discussion." } } ] },
      { id: "diabetes", label: "Diabetes", opts: [
          { v: "none", t: "None" },
          { v: "ctrl", t: "Well controlled", pts: 1 },
          { v: "poor", t: "Poorly controlled, or control unknown", pts: 2,
            adv: { risk: "Poor glycaemic control impairs healing and raises the risk of infection and failure.",
                   action: "Defer until control is established; liaise with the patient’s GP." } } ] },
      { id: "antires", label: "Antiresorptive or antiangiogenic drugs (bisphosphonates, denosumab, others)", opts: [
          { v: "none", t: "None, now or in the past" },
          { v: "osteo", t: "For osteoporosis", pts: 2,
            adv: { risk: "Antiresorptive drugs carry a risk of medication-related osteonecrosis of the jaw after surgery.",
                   action: "Assess the individual risk before planning, discuss it with the patient, and consider specialist advice." } },
          { v: "cancer", t: "For cancer, or high dose", hard: true,
            adv: { risk: "At these doses the risk of osteonecrosis of the jaw after implant surgery is high.",
                   action: "Do not place in primary care. Refer for specialist assessment." } } ] },
      { id: "rt", label: "Radiotherapy to the head and neck", opts: [
          { v: "none", t: "None" },
          { v: "notjaw", t: "Yes, field did not include the jaws", pts: 1,
            adv: { risk: "The exact radiation field matters, and is not always as the patient remembers it.",
                   action: "Confirm the field with the treating oncology team before planning." } },
          { v: "jaw", t: "Yes, including the jaws, or field unknown", hard: true,
            adv: { risk: "Surgery in irradiated bone carries a risk of osteoradionecrosis.",
                   action: "Do not place in primary care. Refer for specialist assessment." } } ] },
      { id: "immuno", label: "Immunosuppression (drugs or condition)", opts: [
          { v: "no", t: "No" },
          { v: "yes", t: "Yes", pts: 1,
            adv: { risk: "Immunosuppression raises the risk of infection and impaired healing.",
                   action: "Liaise with the patient’s physician before planning." } } ] },
      { id: "anticoag", label: "Anticoagulant or antiplatelet medication", opts: [
          { v: "none", t: "None" },
          { v: "ap", t: "Antiplatelet" },
          { v: "ac", t: "Anticoagulant",
            adv: { risk: "Bleeding after surgery is more likely.",
                   action: "Plan bleeding management in line with current guidance, including local measures." } } ] },
      { id: "perio", label: "Periodontal status", opts: [
          { v: "healthy", t: "Healthy, no history of periodontitis" },
          { v: "stable", t: "History of periodontitis, treated and stable", pts: 1,
            adv: { risk: "A history of periodontitis raises the risk of peri-implantitis.",

          { v: "active", t: "Active, untreated periodontitis", hard: true,
            adv: { risk: "Placing an implant into a mouth with active periodontitis puts it at high risk of peri-implantitis.",
                   action: "Treat and stabilise the periodontitis before planning an implant." } } ] },
      { id: "oh", label: "Oral hygiene", opts: [
          { v: "good", t: "Good" },
          { v: "fair", t: "Fair" },
          { v: "poor", t: "Poor", pts: 1,
            adv: { risk: "Poor plaque control is a major risk for peri-implant disease.",
                   action: "Improve and demonstrate hygiene before committing to an implant." } } ] },
      { id: "brux", label: "Bruxism or heavy parafunction", opts: [
          { v: "no", t: "No" },
          { v: "yes", t: "Yes", pts: 1,
            adv: { risk: "Parafunction raises the risk of screw loosening, chipping and fracture.",
                   action: "Plan for protection, such as a night guard, and include mechanical complications in the consent discussion." } } ] },
      { id: "expect", label: "Patient expectations", opts: [
          { v: "realistic", t: "Realistic" },
          { v: "high", t: "Very high aesthetic demand, or unrealistic", pts: 1,
            adv: { risk: "An outcome that is clinically good may still disappoint.",
                   action: "Discuss likely outcomes and limitations explicitly, and record the discussion." } } ] }
    ] },

  { id: "bone", title: "Bone and space", chip: "Bone",
    helper: "Enter what you measured on the CBCT cross-section at the site, and clinically. Leave a box empty if it was not measured.",
    qs: [
      { id: "md", label: "Space between the adjacent teeth, at the crest", type: "mm" },
      { id: "bl", label: "Bone width, buccal to lingual, at the crest", type: "mm" },
      { id: "ht", label: "Available bone height, crest to ", type: "mm", limit: true },
      { id: "rest", label: "Restorative space, crest to opposing tooth", type: "mm" },
      { id: "undercut", label: "Lingual concavity or undercut", when: function (s) { return !s.upper; }, opts: [
          { v: "no", t: "None" },
          { v: "yes", t: "Present", pts: 1,
            adv: { risk: "A lingual concavity can be perforated by a drill following the ridge, with a risk of floor-of-mouth bleeding.",
                   action: "Plan the angle on the cross-section, not the ridge alone." } } ] },
      { id: "sinus", label: "Sinus appearance on the CBCT", when: function (s) { return s.limit.key === "sinus"; }, opts: [
          { v: "clear", t: "Clear" },
          { v: "thick", t: "Mucosal thickening", pts: 1,
            adv: { risk: "Sinus pathology complicates any procedure near the sinus floor.",
                   action: "Assess the sinus before any augmentation, and consider ENT opinion if there are symptoms." } },
          { v: "opaque", t: "Opacified, or fluid level", pts: 2,
            adv: { risk: "An opacified sinus suggests active disease.",
                   action: "Investigate and treat the sinus before planning surgery near it." } } ] }
    ] },

  { id: "impl", title: "Proposed implant", chip: "Implant",
    helper: "Optional. Enter the implant you have in mind, and it is checked against the clearances you set. Leave both empty to skip.",
    qs: [
      { id: "dia", label: "Implant diameter", type: "mm" },
      { id: "len", label: "Implant length", type: "mm" }
    ] }
];

/* ---------- state ---------- */
var answers = {};     // qid -> option value, or text for mm/tooth
var step = 0, started = false, showResult = false, firstRender = true;
var siteCleared = false;  // show, once, that changing the tooth cleared the old site's findings

/* Everything that belongs to one site rather than to the patient. A bone height
   measured to the canal is not a height to the sinus floor, and a phenotype seen
   at 46 is not the phenotype at 16: when the tooth changes, all of it goes. */
var SITE_KEYS = ["timing", "smile", "phenotype", "km", "md", "bl", "ht", "rest", "undercut", "sinus", "dia", "len"];

function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
  return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }

/* A measurement in mm, or null when the box is empty. Accepts "6,5" and
   "6.5 mm". Anything else is refused rather than guessed at: "12..5", "10-12"
   and "4.1/4.3" are not measurements, and nobody measured a 65 mm ridge. */
function mm(v) {
  if (v === undefined || v === null || String(v).trim() === "") return null;
  var t = String(v).trim().replace(/\s*mm$/i, "").replace(",", ".");
  if (!/^(\d+(\.\d+)?|\.\d+)$/.test(t)) return NaN;
  var x = parseFloat(t);
  if (!(x > 0) || x > 40) return NaN;
  return x;
}

/* Clearances are compared at 0.01 mm, and shown at the same precision, so the
   figure on screen can never disagree with the verdict beside it. Unrounded,
   (6.6 - 3.6) / 2 is 1.4999999999999998 and would fail a 1.5 mm check. */
var MM_ERROR = "Enter one measurement in millimetres, above 0 and up to 40, such as 6.5.";
function r2(x) { return Math.round(x * 100) / 100; }
function fmt(x) { return r2(x).toFixed(2).replace(/(\.\d)0$/, "$1"); }

function currentSite() { return answers.tooth ? siteInfo(answers.tooth) : null; }
function applies(q, s) { return !q.when || (s && q.when(s)); }

/* ---------- the assessment: pure, so it can be tested without the page ---------- */
function evaluate(a) {
  var s = a.tooth ? siteInfo(a.tooth) : null;
  var out = { site: s, score: 0, reasons: [], advisories: [], hard: [], unknown: [], checks: [], invalid: [] };

  SECTIONS.forEach(function (sec) {
    sec.qs.forEach(function (q) {
      if (!applies(q, s) || q.type) return;
      var v = a[q.id];
      if (v === undefined) { out.unknown.push(q.label); return; }
      var o = q.opts.filter(function (x) { return x.v === v; })[0];
      if (!o) return;
      if (o.unknown) out.unknown.push(q.label);
      if (o.pts) { out.score += o.pts; out.reasons.push({ pts: o.pts, text: q.label + ": " + o.t }); }
      if (o.hard) out.hard.push({ q: q.label, t: o.t, adv: o.adv });
      else if (o.adv) out.advisories.push({ q: q.label, t: o.t, adv: o.adv });
    });
  });

  if (!s) out.unknown.unshift("Which tooth is being replaced?");
  if (s && s.aesthetic) { out.score += 2; out.reasons.push({ pts: 2, text: "Site in the aesthetic zone" }); }

  var m = {};
  ["md", "bl", "ht", "rest", "dia", "len"].forEach(function (k) {
    m[k] = mm(a[k]);
    if (m[k] !== null && isNaN(m[k])) { out.invalid.push(k); m[k] = null; }
  });
  out.measures = m;

  if (m.rest !== null && m.rest < DRAFT.restorativeMin) {
    out.checks.push({ ok: false, key: "rest", text: "Restorative space " + fmt(m.rest) + " mm is under " + fmt(DRAFT.restorativeMin) + " mm.", pts: 1 });
  }

  // The proposed implant, against each measurement that was taken. A check is
  // only made when both numbers exist: a blank is never read as a pass.
  if (m.dia !== null) {
    if (m.md !== null) {
      var side = r2((m.md - m.dia) / 2);
      out.checks.push({ ok: side >= DRAFT.toothClearance, key: "md", pts: 2,
        text: "Clearance to each adjacent tooth: " + fmt(side) + " mm (needs " + fmt(DRAFT.toothClearance) + " mm)." +
          (side < DRAFT.toothClearance ? " A narrower implant would be needed." : "") });
    }
    if (m.bl !== null) {
      var wall = r2((m.bl - m.dia) / 2);
      out.checks.push({ ok: wall >= DRAFT.wallClearance, key: "bl", pts: 2,
        text: "Bone left buccally and lingually, implant centred: " + fmt(wall) + " mm each side (needs " + fmt(DRAFT.wallClearance) + " mm)." +
          (wall < DRAFT.wallClearance ? " Grafting, or a narrower implant, would be needed." : "") });
    }
  }
  if (m.len !== null && m.ht !== null && s) {
    if (s.limit.vital) {
      var spare = r2(m.ht - m.len);
      out.checks.push({ ok: spare >= DRAFT.vitalClearance, key: "ht", pts: 3, vital: true,
        text: "Apex to " + s.limit.label + ": " + fmt(spare) + " mm (needs " + fmt(DRAFT.vitalClearance) + " mm)." +
          (spare < DRAFT.vitalClearance ? " Choose a shorter implant." : "") });
    } else {
      var over = r2(m.len - m.ht);
      out.checks.push({ ok: over <= 0, key: "ht", pts: over > 0 ? 3 : 0,
        text: over > 0
          ? "The implant is " + fmt(over) + " mm longer than " + s.limit.bone + "." +
            (s.limit.key === "sinus" ? " Sinus floor elevation, or a shorter implant, would be needed." : " A shorter implant would be needed.")
          : "The implant fits within " + s.limit.bone + "." });
    }
  }
  out.checks.forEach(function (c) { if (!c.ok) { out.score += c.pts; out.reasons.push({ pts: c.pts, text: c.text }); } });

  var band = DRAFT.bands.filter(function (b) { return out.score <= b.max; })[0];
  // A proposed implant that reaches into the nerve clearance is not a case to
  // rate: it is a plan to change. No score may call it straightforward.
  out.vitalBreach = out.checks.some(function (c) { return c.vital && !c.ok; });
  out.rating = out.hard.length ? "Outside routine placement"
    : (out.vitalBreach ? "Revise the proposed implant" : band.label);
  return out;
}

var MEASURE_NAMES = { md: "Space between the adjacent teeth", bl: "Bone width", ht: "Available bone height",
  rest: "Restorative space", dia: "Implant diameter", len: "Implant length" };
function bandsText() {
  var lo = 0;
  return DRAFT.bands.map(function (b) {
    var t = b.max === Infinity ? lo + " or more " + b.label.toLowerCase()
      : (lo === b.max ? String(lo) : (lo === 0 ? "up to " + b.max : lo + " to " + b.max)) + " " + b.label.toLowerCase();
    lo = b.max + 1; return t;
  }).join(", ");
}

/* ---------- consent points: the 20 implant-consult items AI Notes checks for,
   so the conversation this plan leads to is the one that tool listens for. ---------- */
var CONSENT = [
  "The implant may fail to integrate, or be lost later",
  "Peri-implantitis, and the need for lifelong maintenance",
  "Nerve injury (lower posterior) or sinus involvement (upper posterior), as relevant to this site",
  "Possible damage to adjacent teeth or roots",
  "Recession, bone loss, or an appearance not as expected",
  "Whether grafting or a sinus lift may be needed",
  "Screw loosening, chipping, and the crown needing replacement in time",
  "The stages, and how long the whole process takes",
  "The full cost, including the restoration and any grafting",
  "What happens if it fails, and any guarantee",
  "Alternatives: leaving the space, a denture, a bridge",
  "Oral hygiene and gum health as a condition of success"
];

var PLANNING_CHECKS = [
  "Confirm the nerve canal on the cross-sections yourself; do not rely on an automatic trace.",
  "If the CBCT is fused with an intraoral scan, check the fit on the teeth before planning on it.",
  "Confirm that the implant library entry matches the system and size you will place.",
  "If a guide is used, check its seating on the model before surgery."
];

/* ---------- rendering ---------- */
function h(html) { document.getElementById("root").innerHTML = html; }

function headerHTML() {
  return '<header class="app">' +
    '<div class="eyebrow-top">Oral Surgery · Implant planning</div>' +
    '<h1 class="app" tabindex="-1">Implant Case Assessment</h1>' +
    '<div class="byline">Developed by Aiden McCann · v' + VERSION + '</div>' +
    '</header>';
}

function coverHTML() {
  return headerHTML() +
    '<p class="lede">A structured assessment for a <strong>single-tooth implant</strong>: the site, the patient, the ' +
      'measurements you took from your CBCT, and an optional check of the implant you have in mind. It ends in a plan ' +
      'summary to copy into your notes.</p>' +
    '<div class="infobox"><p>It does not read images. Every measurement is yours; the tool records it and checks it ' +
      'against the clearances set out in the summary.</p></div>' +
    '<div class="infobox"><p>Nothing is saved. This tool holds no patient identifiers, stores nothing on the device, and ' +
      'sends nothing anywhere.</p></div>' +
    '<div class="nav" style="border-top:none;padding-top:0;">' +
      '<button type="button" class="btn primary" data-act="begin">Begin assessment</button></div>' +
    '<p class="disclaim">This tool supports the treating clinician’s assessment and does not replace it, a full ' +
      'history and examination, or the clinician’s own interpretation of the imaging.</p>';
}

function railHTML() {
  var out = '<div class="rail">';
  SECTIONS.forEach(function (s, i) {
    var cls = i === step && !showResult ? "on" : (i < step || showResult ? "done" : "");
    out += '<span class="' + cls + '">' + esc(s.chip) + '</span>';
  });
  return out + '<span class="' + (showResult ? "on" : "") + '">Plan</span></div>';
}

function questionHTML(q, s) {
  var out = '<div class="field">';
  if (q.type === "tooth") {
    out += '<label class="label" for="tooth">' + esc(q.label) + '</label>';
    out += '<select id="tooth" class="sel"><option value="">Select tooth (FDI)</option>';
    SITES.forEach(function (t) {
      out += '<option value="' + t + '"' + (String(answers.tooth) === String(t) ? " selected" : "") + '>' + t + '</option>';
    });
    out += '</select>';
    if (s) out += '<p class="helper" style="margin:10px 0 0;">' + esc(siteLine(s)) + '</p>';
  } else if (q.type === "mm") {
    var label = q.label + (q.limit ? (s ? s.limit.label : "the limiting structure") : "");
    var val = answers[q.id] === undefined ? "" : answers[q.id];
    var bad = val !== "" && isNaN(mm(val));
    out += '<label class="label" for="in-' + q.id + '">' + esc(label) + '</label>';
    out += '<div class="num"><input id="in-' + q.id + '" data-mm="' + q.id + '" type="text" inputmode="decimal" ' +
      'autocomplete="off" placeholder="mm" value="' + esc(val) + '" aria-describedby="err-' + q.id + '" /><span class="unit">mm</span></div>';
    out += '<div class="err" id="err-' + q.id + '">' + (bad ? MM_ERROR : "") + '</div>';
  } else {
    out += '<span class="label">' + esc(q.label) + '</span><div class="opts">';
    q.opts.forEach(function (o) {
      var on = answers[q.id] === o.v;
      out += '<button type="button" class="opt" aria-pressed="' + (on ? "true" : "false") +
        '" data-q="' + esc(q.id) + '" data-v="' + esc(o.v) + '"><span class="dot"></span>' + esc(o.t) + '</button>';
    });
    out += '</div>';
    var chosen = q.opts.filter(function (o) { return o.v === answers[q.id]; })[0];
    if (chosen && chosen.adv) out += advHTML(chosen.adv, chosen.hard);
  }
  return out + '</div>';
}

function siteLine(s) {
  return (s.upper ? "Upper" : "Lower") + " " + (s.posterior ? "posterior" : "anterior") +
    (s.aesthetic ? ", in the aesthetic zone" : "") + ". Height is limited by " + s.limit.label + ".";
}

function advHTML(adv, hard) {
  return '<div class="adv' + (hard ? " hard" : "") + '"><p><strong>' + (hard ? "Outside routine placement. " : "") +
    '</strong>' + esc(adv.risk) + '</p><p>' + esc(adv.action) + '</p></div>';
}

function sectionHTML() {
  var sec = SECTIONS[step], s = currentSite();
  var out = headerHTML() + '<div class="progress">Section ' + (step + 1) + ' of ' + SECTIONS.length + '</div>' + railHTML();
  out += '<h2 class="q" tabindex="-1">' + esc(sec.title) + '</h2>';
  if (sec.helper) out += '<p class="helper">' + esc(sec.helper) + '</p>';
  if (sec.id !== "site" && !s) out += '<div class="card warn"><p class="setting">No tooth selected yet. Some questions depend on the site.</p></div>';
  if (sec.id === "site" && siteCleared) out += '<div class="card warn" role="status"><p class="setting">The tooth changed, so the site ' +
    'findings, measurements and proposed implant recorded for the previous tooth were cleared. They do not apply to this one.</p></div>';
  sec.qs.forEach(function (q) { if (applies(q, s)) out += questionHTML(q, s); });
  out += '<div class="nav noprint">';
  if (step > 0) out += '<button type="button" class="btn" data-act="back">Back</button>';
  out += '<button type="button" class="btn primary" data-act="next">' + (step === SECTIONS.length - 1 ? "See the plan" : "Continue") + '</button></div>';
  return out;
}

/* The height is only meaningful with the structure it was measured to. */
function measureName(k, s) {
  return k === "ht" ? "Available bone height, crest to " + (s ? s.limit.label : "the limiting structure (no tooth selected)")
    : MEASURE_NAMES[k];
}

function planText(r) {
  var L = [];
  L.push("IMPLANT CASE ASSESSMENT (v" + VERSION + ")");
  L.push("PREVIEW: DRAFT FIGURES, NOT FOR CLINICAL USE");
  if (r.site) L.push("Site: " + r.site.tooth + " — " + siteLine(r.site));
  else L.push("Site: not selected");
  L.push("Complexity: " + r.rating + (r.hard.length ? "" : " (score " + r.score + ")"));
  r.hard.forEach(function (x) { L.push("OUTSIDE ROUTINE PLACEMENT: " + x.q + " — " + x.t + ". " + x.adv.action); });
  var m = r.measures;
  var took = Object.keys(MEASURE_NAMES).filter(function (k) { return m[k] !== null; });
  if (took.length) {
    L.push("Measurements (clinician, from CBCT and clinical):");
    took.forEach(function (k) { L.push("  " + measureName(k, r.site) + ": " + m[k] + " mm"); });
  }
  if (r.invalid.length) {
    L.push("Not used, not valid measurements: " + r.invalid.map(function (k) { return measureName(k, r.site); }).join("; "));
  }
  if (r.checks.length) {
    L.push("Checks:");
    r.checks.forEach(function (c) { L.push("  " + (c.ok ? "OK  " : "FLAG ") + c.text); });
  }
  if (r.advisories.length) {
    L.push("Advisories:");
    r.advisories.forEach(function (x) { L.push("  " + x.q + " — " + x.t + ". " + x.adv.action); });
  }
  if (r.unknown.length) L.push("Not recorded: " + r.unknown.join("; "));
  return L.join("\n");
}

function resultHTML() {
  var r = evaluate(answers);
  var out = headerHTML() + railHTML();
  out += '<span class="eyebrow">Plan summary</span><h2 class="res" tabindex="-1">' +
    (r.site ? "Implant at " + r.site.tooth : "Implant plan") + '</h2>';

  if (r.hard.length) {
    out += '<div class="card alert"><p class="grade">Outside routine placement</p><div class="gradesub">One or more findings mean this case should not go ahead as a routine placement. What each one needs:</div><ul class="because">';
    r.hard.forEach(function (x) { out += '<li><strong>' + esc(x.t) + '.</strong> ' + esc(x.adv.action) + '</li>'; });
    out += '</ul></div>';
  } else if (r.vitalBreach) {
    out += '<div class="card alert"><p class="grade">Revise the proposed implant</p><div class="gradesub">As entered, the implant ' +
      'reaches into the clearance to ' + esc(r.site.limit.label) + '. Change the implant before rating the case. ' +
      'Complexity score so far ' + r.score + '.</div></div>';
  } else {
    out += '<div class="card"><p class="grade">' + esc(r.rating) + '</p>' +
      '<div class="gradesub">Complexity score ' + r.score + ' (draft bands: ' + esc(bandsText()) + ').</div>';
    if (r.reasons.length) {
      out += '<ul class="because">';
      r.reasons.forEach(function (x) { out += '<li>' + esc(x.text) + ' <span class="pts">+' + x.pts + '</span></li>'; });
      out += '</ul>';
    }
    out += '</div>';
  }

  if (!r.site) {
    out += '<div class="card warn"><p class="setting"><strong>No tooth was selected.</strong> The questions that depend on the ' +
      'site were not asked, and the implant length could not be checked against the bone height.</p></div>';
  }
  if (r.invalid.length) {
    out += '<div class="card warn"><p class="setting"><strong>Not used:</strong> ' +
      esc(r.invalid.map(function (k) { return measureName(k, r.site) + ' ("' + answers[k] + '")'; }).join("; ")) +
      '. These are not valid measurements, so nothing was checked against them. Go back and correct them.</p></div>';
  }
  if (r.unknown.length) {
    out += '<div class="card warn"><p class="setting"><strong>' + r.unknown.length + ' item' + (r.unknown.length === 1 ? ' was' : 's were') +
      ' not recorded.</strong> The rating reflects only what was recorded.</p><ul class="flaglist">';
    r.unknown.forEach(function (u) { out += '<li>' + esc(u) + '</li>'; });
    out += '</ul></div>';
  }

  var took = Object.keys(MEASURE_NAMES).filter(function (k) { return r.measures[k] !== null; });
  if (took.length) {
    out += '<h3 class="block">Measurements recorded</h3><ul class="flaglist">';
    took.forEach(function (k) { out += '<li>' + esc(measureName(k, r.site)) + ': ' + esc(String(r.measures[k])) + ' mm</li>'; });
    out += '</ul>';
  }

  out += '<h3 class="block">Checks against the proposed implant</h3>';
  if (!r.checks.length) out += '<p class="helper">No proposed implant, or no measurements to check it against.</p>';
  else {
    out += '<ul class="checks">';
    r.checks.forEach(function (c) { out += '<li class="' + (c.ok ? "ok" : "flag") + '">' + esc(c.text) + '</li>'; });
    out += '</ul>';
  }

  if (r.advisories.length) {
    out += '<h3 class="block">Advisories</h3>';
    r.advisories.forEach(function (x) { out += advHTML(x.adv, false); });
  }

  out += '<h3 class="block">Cover in the consent discussion</h3><ul class="flaglist">';
  CONSENT.forEach(function (c) { out += '<li>' + esc(c) + '</li>'; });
  out += '</ul>';

  out += '<h3 class="block">Check in your planning software</h3><ul class="flaglist">';
  PLANNING_CHECKS.forEach(function (c) { out += '<li>' + esc(c) + '</li>'; });
  out += '</ul>';

  out += '<div class="nav noprint">' +
    '<button type="button" class="btn primary" data-act="copy">Copy plan to notes</button>' +
    '<button type="button" class="btn" data-act="print">Print</button>' +
    '<button type="button" class="btn" data-act="back">Back to questions</button>' +
    '<button type="button" class="btn" data-act="restart">Start again</button></div>';
  out += '<div id="copy-fallback" class="noprint" hidden><p class="helper">Copying is not available in this browser. ' +
    'The plan is below: select it and copy it by hand.</p><textarea id="plan-text" readonly rows="12" class="plantext"></textarea></div>';
  out += '<p class="attrib">Draft clearances used: ' + fmt(DRAFT.toothClearance) + ' mm to adjacent roots, ' + fmt(DRAFT.wallClearance) +
    ' mm of bone buccally and lingually, ' + fmt(DRAFT.vitalClearance) + ' mm from the apex to a nerve, ' + fmt(DRAFT.restorativeMin) +
    ' mm restorative space. This summary supports the treating clinician’s plan and does not replace it. It records no patient identifiers and stores nothing.</p>';
  return out;
}

function viewKey() { return !started ? "cover" : (showResult ? "result" : "step-" + step); }
var lastView = null;

/* Which control has focus, as a selector that finds its replacement after a
   re-render. Without this, every answer threw keyboard focus back to the top. */
function focusKey() {
  var a = document.activeElement;
  if (!a || a === document.body) return null;
  if (a.dataset && a.dataset.q) return '[data-q="' + a.dataset.q + '"][data-v="' + a.dataset.v + '"]';
  if (a.id) return "#" + a.id;
  return null;
}

function render() {
  var scrollBefore = window.scrollY, keep = focusKey();
  h('<div class="shell">' + (!started ? coverHTML() : (showResult ? resultHTML() : sectionHTML())) + '</div>');
  var view = viewKey(), changed = view !== lastView;
  lastView = view;
  if (firstRender) { firstRender = false; return; }
  if (changed) {
    var head = document.querySelector('#root h2[tabindex="-1"], #root h1[tabindex="-1"]');
    if (head) head.focus({ preventScroll: true });
    window.scrollTo(0, 0);
  } else {
    var again = keep && document.querySelector("#root " + keep);
    if (again) again.focus({ preventScroll: true });
    window.scrollTo(0, scrollBefore);
  }
}

function copyByHand(text) {
  var box = document.getElementById("copy-fallback"), area = document.getElementById("plan-text");
  if (!box || !area) return;
  area.value = text; box.hidden = false;
  area.focus(); area.select();
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var t = e.target.closest ? e.target.closest("button") : null;
  if (!t) return;
  if (t.dataset.q) { answers[t.dataset.q] = t.dataset.v; render(); return; }
  var act = t.dataset.act;
  if (act === "begin" || act === "next" || act === "back" || act === "restart") siteCleared = false;
  if (act === "begin") { started = true; render(); }
  else if (act === "next") { if (step === SECTIONS.length - 1) showResult = true; else step++; render(); }
  else if (act === "back") { if (showResult) { showResult = false; step = SECTIONS.length - 1; } else if (step > 0) step--; render(); }
  else if (act === "restart") { answers = {}; step = 0; started = false; showResult = false; render(); }
  else if (act === "print") { window.print(); }
  else if (act === "copy") {
    var text = planText(evaluate(answers));
    var done = function () { t.textContent = "Copied"; setTimeout(function () { t.textContent = "Copy plan to notes"; }, 1600); };
    // Never fail silently: an unchanged clipboard would paste the previous
    // patient's plan, or whatever was copied last.
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { copyByHand(text); });
    } else copyByHand(text);
  }
});

document.addEventListener("change", function (e) {
  if (e.target.id === "tooth") {
    var before = answers.tooth, after = e.target.value || undefined;
    if (after === before) return;
    answers.tooth = after;
    // A different tooth is a different site: everything recorded for the old
    // one goes, and the clinician is told. Patient factors stay.
    if (before !== undefined) {
      var had = SITE_KEYS.some(function (k) { return answers[k] !== undefined && answers[k] !== ""; });
      SITE_KEYS.forEach(function (k) { delete answers[k]; });
      siteCleared = had;
    }
    // And no answer survives to a question the new site does not ask.
    var s = currentSite();
    SECTIONS.forEach(function (sec) { sec.qs.forEach(function (q) { if (!applies(q, s)) delete answers[q.id]; }); });
    render();
  }
});

document.addEventListener("input", function (e) {
  var k = e.target.dataset && e.target.dataset.mm;
  if (!k) return;
  answers[k] = e.target.value;
  var err = document.getElementById("err-" + k);
  if (err) err.textContent = e.target.value !== "" && isNaN(mm(e.target.value)) ? MM_ERROR : "";
});

render();

/* Nothing is stored, so leaving discards the assessment. Warn while one is in progress. */
window.addEventListener("beforeunload", function (e) {
  if (!started || !Object.keys(answers).length) return;
  e.preventDefault();
  e.returnValue = "";
});

// For the test suite: the assessment logic, with no access to anything else.
window.__implant = { evaluate: evaluate, siteInfo: siteInfo, mm: mm, fmt: fmt, planText: planText, DRAFT: DRAFT, SECTIONS: SECTIONS };

if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
