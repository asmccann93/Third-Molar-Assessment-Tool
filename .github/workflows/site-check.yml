name: Site check

# Two silent failures have bitten this site before, and both ship green:
#   - a page deployed with an out-of-date switcher, so one tool vanishes
#     from the bar on that page only
#   - index.html changed without the service worker CACHE name moving, so
#     installed browsers keep serving the old page indefinitely
# This catches both before Vercel deploys.
#
# AI Notes added a third: a bad deploy on that path can now take the four
# clinical tools down with it, because middleware.js and vercel.json sit at the
# repo root and apply to the whole origin. The canary job at the bottom watches
# for exactly that.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Daily canary. Not tied to a deploy: it answers "is the live site still
    # correct right now", which is the question that matters after a change
    # nobody noticed.
    - cron: '17 7 * * *'
  workflow_dispatch:

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Full history: a push can carry several commits, and the cache step
      # below compares against the commit BEFORE the push, not just HEAD~1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Switcher completeness, aria-current placement and manifest icons.
      # Also, since AI Notes: that the gated tool IS linked from every public
      # switcher (that assertion was inverted on 2 September 2026 when the tab
      # was made visible; the passcode gate, not the link's absence, is the
      # control), that its worker caches nothing, and that its page persists
      # nothing. The stored fingerprint baseline goes stale the moment anything
      # is committed, so the cache comparison is done from git history instead.
      - name: Structure
        run: node site-check.js . --skip-cache

      # The suites used to run only on someone's laptop, so a green tick here
      # said nothing about them. Every one of these is offline: no network, no
      # credentials, nothing to configure.
      - name: API handlers
        run: node tests/integration.mjs

      # Note: tests/prompt-eval.paste.js is generated, not committed. This step
      # proves the template and fixtures still produce a valid evaluator; it
      # cannot check a file in the repo, because there isn't one. Regenerate
      # locally before pasting it into the console.
      - name: Prompt evaluator builds and self-tests
        run: node tests/build-eval.mjs

      - name: The page, in jsdom
        run: |
          npm install jsdom --no-save --silent
          node tests/page.mjs

      # The implant tool (in preview) and its CBCT viewer core. The viewer is
      # proved on a synthetic phantom the test builds itself, so no scan of any
      # person is needed here or anywhere in the repo.
      - name: Implant tool, in jsdom, and the viewer on a phantom
        run: node tests/implant.mjs

      - name: Cache names must move when a tool changes
        env:
          # The tip of main before this push; all zeros when the branch is new.
          # Pushes only: on a pull request's later pushes `before` is the PR's
          # previous head, which would fail a bump already made earlier in the PR.
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          # Compare against everything this push brought in, not just its last
          # commit: a push of three commits used to check only the third, so an
          # index.html edited in the first went unchecked. For a pull request
          # HEAD is the merge commit and HEAD~1 is the base branch, so HEAD~1
          # already covers the whole PR.
          before=""
          if [ -n "$PUSH_BEFORE" ] && ! echo "$PUSH_BEFORE" | grep -qE '^0+$' \
             && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            before="$PUSH_BEFORE"
          else
            before=$(git rev-parse HEAD~1 2>/dev/null || echo "")
          fi
          if [ -z "$before" ]; then echo "No previous commit - nothing to compare."; exit 0; fi
          echo "Comparing $before..HEAD"
          # The CACHE constant's value, as site-check.js reads it (either quote style).
          cache_of() {
            grep -oE "CACHE[[:space:]]*=[[:space:]]*[\"'][^\"']+[\"']" \
              | head -n1 | sed -E "s/.*[\"']([^\"']+)[\"']\$/\\1/" || true
          }
          fail=0
          # ai-notes is deliberately NOT in this list. Its service worker has no
          # CACHE constant and never will - it caches nothing, which is the
          # entire point of it. Adding it here would fail this step every single
          # time the page is edited, because the matching sw.js has no reason to
          # change. site-check.js asserts the inverse for that path instead:
          # that no cache exists. Do not "fix" this by adding it.
          # implant is out of this list while it is gated (21 September 2026), for
          # the same reason as ai-notes: its worker is network-only and has no
          # CACHE to bump, and site-check.js refuses one if it appears. Put it
          # back, with the viewer.js rule below, when the gate comes off.
          for dir in "." "third-molar" "sedation" "local-anaesthetic" "asa-assessment"; do
            if [ "$dir" = "." ]; then idx="index.html"; sw="sw.js";
            else idx="$dir/index.html"; sw="$dir/sw.js"; fi
            if [ ! -f "$idx" ]; then continue; fi
            if ! git diff --quiet "$before" HEAD -- "$idx"; then
              # Any edit to sw.js used to count as a bump. A comment change is
              # not one: browsers only drop the old copy when the NAME moves.
              old=$( (git show "$before:$sw" 2>/dev/null || true) | cache_of)
              new=$(cache_of < "$sw" 2>/dev/null || true)
              if [ -z "$new" ]; then
                echo "FAIL  $idx changed and no CACHE constant could be read from $sw."
                fail=1
              elif [ "$old" = "$new" ]; then
                echo "FAIL  $idx changed but the CACHE in $sw is still \"$new\"."
                echo "      Installed browsers will keep serving the old page."
                echo "      Bump the CACHE constant in $sw."
                fail=1
              else
                echo "ok    $idx changed, CACHE ${old:-(none)} -> $new"
              fi
            fi
          done
          exit $fail

  canary:
    # Hits production, so it cannot run on push: Vercel is still building at
    # that point and this would test the previous deployment. Run it by hand
    # from the Actions tab a minute after a deploy, or let the schedule catch it.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SITE: https://oralsurgeryassess.com
    steps:
      - name: The four tools and the hub must stay open
        run: |
          fail=0
          for p in "/" "/third-molar/" "/sedation/" "/local-anaesthetic/" "/asa-assessment/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$p")
            if [ "$code" = "200" ]; then
              echo "ok    $p  $code"
            else
              echo "FAIL  $p  $code  - expected 200."
              echo "      A public clinical tool is unreachable. If this began after an"
              echo "      AI Notes change, suspect the middleware.js matcher first."
              fail=1
            fi
          done
          exit $fail

      - name: AI Notes and the implant preview must stay shut
        run: |
          fail=0
          # The implant preview is kept to its author while its figures are
          # drafts (21 September 2026). The page and the CBCT bundle must both
          # answer 401 to anyone without a session; a 200 means the draft
          # figures are public.
          # Other spellings of the same paths must not open anything either:
          # middleware.js normalises them, but only for requests the matcher
          # sends it, and whether Vercel's matcher decodes %-escapes or folds
          # case is not documented. Anything but 200 is fine here (404 is the
          # likely answer); a 200 means the gate can be walked round.
          for p in "/%69mplant/" "/IMPLANT/" "/Implant/viewer.js" "/ai-notes/%61dmin/" "/ai-notes//admin/" "/%61i-notes/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$p")
            if [ "$code" = "200" ]; then
              echo "FAIL  $p  200  - a gated page answers under another spelling. Treat as urgent."
              fail=1
            else
              echo "ok    $p  $code"
            fi
          done
          for p in "/implant/" "/implant/viewer.js" "/ai-notes/admin/" "/api/users"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE$p")
            if [ "$code" = "401" ]; then
              echo "ok    $p  401"
            else
              echo "FAIL  $p  $code  - expected 401."
              [ "$code" = "200" ] && echo "      The implant gate is OPEN. Treat as urgent."
              fail=1
            fi
          done

          # The bare paths, without the trailing slash, are a different URL to
          # the middleware matcher and to the service workers. They must never
          # answer 200 either: a 401 straight away, or a redirect (Vercel uses
          # 308) to the slashed path, which must then answer 401.
          for p in "/implant" "/ai-notes"; do
            out=$(curl -s -o /dev/null -w "%{http_code} %{redirect_url}" "$SITE$p")
            code=${out%% *}; loc=${out#* }
            case "$code" in
              401)
                echo "ok    $p  401" ;;
              301|302|303|307|308)
                final=$(curl -s -L --max-redirs 5 -o /dev/null -w "%{http_code}" "$SITE$p")
                if [ "$final" = "401" ]; then
                  echo "ok    $p  $code -> $loc  401"
                else
                  echo "FAIL  $p  $code -> $loc  $final  - expected the redirect to end in 401."
                  [ "$final" = "200" ] && echo "      The gate is OPEN on the bare path. Treat as urgent."
                  fail=1
                fi ;;
              *)
                echo "FAIL  $p  $code  - expected 401, or a redirect ending in 401."
                [ "$code" = "200" ] && echo "      The gate is OPEN on the bare path. Treat as urgent."
                fail=1 ;;
            esac
          done

          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/ai-notes/")
          if [ "$code" = "401" ]; then
            echo "ok    /ai-notes/  401"
          else
            echo "FAIL  /ai-notes/  $code  - expected 401."
            [ "$code" = "200" ] && echo "      The gate is OPEN. Treat as urgent."
            [ "$code" = "404" ] && echo "      The deploy did not land, or middleware is not running."
            fail=1
          fi

          # The API must be gated too. /api/auth is deliberately open (there is
          # otherwise no way to log in) so it is checked separately below.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/api/transcribe")
          if [ "$code" = "401" ]; then
            echo "ok    /api/transcribe  401"
          else
            echo "FAIL  /api/transcribe  $code  - expected 401. This route proxies a paid"
            echo "      transcription account and must never answer unauthenticated."
            fail=1
          fi

          # Open by design, but must not accept GET.
          code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE/api/auth")
          if [ "$code" = "405" ]; then
            echo "ok    /api/auth  405 (open by design, POST only)"
          else
            echo "warn  /api/auth  $code  - expected 405."
          fi
          exit $fail

      - name: AI Notes must stay unindexable and uncached
        run: |
          fail=0
          hdr=$(curl -s -D - -o /dev/null "$SITE/ai-notes/" | tr 'A-Z' 'a-z')
          echo "$hdr" | grep -q 'x-robots-tag:.*noindex' \
            && echo "ok    x-robots-tag: noindex" \
            || { echo "FAIL  /ai-notes/ is missing X-Robots-Tag: noindex"; fail=1; }
          echo "$hdr" | grep -q 'cache-control:.*no-store' \
            && echo "ok    cache-control: no-store" \
            || { echo "FAIL  /ai-notes/ is missing Cache-Control: no-store"; fail=1; }
          curl -s "$SITE/sitemap.xml" | grep -q 'ai-notes' \
            && { echo "FAIL  sitemap.xml lists /ai-notes/. Remove it."; fail=1; } \
            || echo "ok    sitemap.xml does not mention it"
          exit $fail
